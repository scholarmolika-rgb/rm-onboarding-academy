name: db-tests
on: [pull_request, push]
jobs:
  gating-engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres, PGDATABASE: postgres }
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_question_seed.py
      - name: State store adapter test
        run: node scripts/store.test.mjs
      - name: Apply migrations, seed, run tests
        run: |
          set -e
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/_ci_auth_stub.sql
          for f in supabase/migrations/*.sql supabase/seed.sql supabase/seed_questions.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/gating_test.sql | tail -5
