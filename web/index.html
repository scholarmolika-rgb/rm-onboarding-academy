  if(ME.status==='remediation')return `<h2>Refresher assigned</h2><p>Complete the refresher modules in the Training programme, then your second attempt opens.</p><button class="btn btn-primary" id="finishRem">Mark refresher complete</button>`;
  const open=openItems(ME.phase);
  const shadowNeed=g.final&&ME.shadow.filter(s=>s.state==='approved').length<4;
  if(!quiz){return `<div class="panel-h"><h2>${g.title}</h2><span class="pill p-info">Pass mark ${g.pass}%</span></div>
    <p>${g.n} questions, one at a time, ${SECS} seconds each. Attempt ${ME.attempts[g.key]+1} of ${MAX_ATTEMPTS}.${ME.supervised?' <b>This re-sit must be taken in the supervised test room.</b>':''}</p>
    ${open.length?`<div class="callout warn">${open.length} learning item${open.length>1?'s':''} still open in this phase. The assessment opens when all are complete.</div>`:shadowNeed?`<div class="callout warn">You need 4 approved shadow logs before the Day 30 assessment.</div>`:''}
    <div class="row"><button class="btn btn-primary" id="startQuiz" ${open.length||shadowNeed?'disabled':''}>Start assessment</button></div>
    <p class="muted small">Below ${g.pass}%, ${g.roles.map(r=>ROLE_NAMES[r]).join(', ').replace(/, ([^,]*)$/,' and $1')} are emailed and each gives you a one-day coaching session.</p>`}
  if(quiz.stage==='declare')return `<h2>Before you begin</h2><ul class="rules">
     <li>Questions appear one at a time with a ${SECS}-second timer. You cannot go back.</li>
     <li>Calculation questions use your own numbers; a colleague's answers will not match.</li>
     <li>The Academy Assistant and your notes are hidden until you submit.</li>
     <li>Leaving this screen, copying or pasting is recorded. Unusual activity leads to a short conversation with your mentor, never an automatic fail.</li>
     <li>Answers you cannot explain later may be voided, with a supervised re-sit and a conduct review.</li></ul>
    <label class="row" style="align-items:flex-start;gap:10px"><input type="checkbox" id="honour" style="margin-top:4px;accent-color:var(--accent)"><span>I will answer on my own, without AI tools, notes, colleagues or other devices.</span></label>
    <div class="row"><button class="btn btn-primary" id="beginQuiz" disabled>Begin</button><span class="muted small">Opens full screen where your browser allows.</span></div>`;
  const q=quiz.paper[quiz.i];
  return `<div class="panel-h"><h2>Question ${quiz.i+1} of ${quiz.paper.length}</h2><span class="num mono" id="clock">${quiz.left}s</span></div>
   <div class="bar"><i id="clockBar" style="width:${quiz.left/SECS*100}%"></i></div>
   <div class="quiz-q"><div><span class="kind">${q.module}</span> ${esc(q.stem)}</div>${q.options.map((o,j)=>`<label class="opt"><input type="radio" name="cur" data-o="${j}"><span>${esc(o)}</span></label>`).join('')}</div>
   <div class="row between"><button class="btn btn-primary" id="nextQ" disabled>${quiz.i+1<quiz.paper.length?'Save and next':'Save and submit'}</button><span class="muted small" id="evtNote">${evtSummary()}</span></div>`}
function beginSecure(){const g=curGate();
  const paper=CONTENT.bank[g.bank].slice().sort(()=>Math.random()-.5).slice(0,g.n).map(variant).map(shuffleQ);
  quiz={stage:'q',gate:g.key,paper,i:0,left:SECS,served:Date.now(),ans:[],ev:{focus_lost:0,copy_paste:0,fullscreen_exit:0,assistant_during_test:0}};
  ME.testOpen=true;ME.status='testing';document.body.classList.add('testing');$('#drawer').hidden=true;
  try{const r=document.documentElement.requestFullscreen?.();r&&r.catch(()=>{})}catch(_){}
  $('#assessPanel').innerHTML=assessHTML();tick()}
function tick(){clearInterval(clockH);clockH=setInterval(()=>{if(!quiz||quiz.stage!=='q'){clearInterval(clockH);return}
  quiz.left=Math.max(0,SECS-Math.floor((Date.now()-quiz.served)/1000));const c=$('#clock'),b=$('#clockBar');
  if(c)c.textContent=quiz.left+'s';if(b){b.style.width=(quiz.left/SECS*100)+'%';b.style.background=quiz.left<15?'var(--crit)':'var(--accent)'}
  if(quiz.left<=0)saveAnswer(null)},250)}
function saveAnswer(ch){quiz.ans.push({q:quiz.paper[quiz.i],choice:ch,ms:Date.now()-quiz.served});quiz.i++;quiz.served=Date.now();quiz.left=SECS;
  if(quiz.i>=quiz.paper.length){finishSecure();return}$('#assessPanel').innerHTML=assessHTML()}
function evtSummary(){if(!quiz?.ev)return '';const e=quiz.ev,p=[];if(e.focus_lost)p.push(`left screen ${e.focus_lost}×`);if(e.copy_paste)p.push(`copy/paste ${e.copy_paste}×`);if(e.fullscreen_exit)p.push(`left full screen ${e.fullscreen_exit}×`);if(e.assistant_during_test)p.push('assistant opened');return p.length?'Recorded: '+p.join(' · '):'No unusual activity recorded'}
function rec(k){if(quiz?.stage==='q'){quiz.ev[k]++;const n=$('#evtNote');if(n)n.textContent=evtSummary()}}
function integrity(ev,ans){let s=0;const f={};
  if(ev.focus_lost){f.focus_lost=ev.focus_lost;s+=Math.min(45,Math.max(0,ev.focus_lost-1)*15)}
  if(ev.copy_paste){f.copy_paste=ev.copy_paste;s+=30} if(ev.fullscreen_exit){f.fullscreen_exit=ev.fullscreen_exit;s+=Math.min(30,ev.fullscreen_exit*15)}
  if(ev.assistant_during_test){f.assistant_during_test=ev.assistant_during_test;s+=20}
  const fast=ans.filter(a=>a.q.calc&&a.choice===a.q.answer&&a.ms<8000).length;if(fast>=2){f.implausibly_fast_correct=fast;s+=Math.min(30,fast*10)}
  return {score:Math.min(100,s),flags:f}}
function finishSecure(){clearInterval(clockH);ME.testOpen=false;document.body.classList.remove('testing');try{document.fullscreenElement&&document.exitFullscreen()}catch(_){}
  const by={};let ok=0;quiz.ans.forEach(({q,choice})=>{by[q.module]=by[q.module]||[0,0];by[q.module][1]++;if(choice===q.answer){ok++;by[q.module][0]++}});
  const mods={};Object.entries(by).forEach(([m,[a,b]])=>mods[m]=Math.round(a/b*100));
  const g=quiz.gate,ans=quiz.ans,integ=integrity(quiz.ev,ans);quiz=null;
  submit(g,Math.round(ok/ans.length*100),mods,integ,ans)}
function submit(gk,score,mods,integ={score:0,flags:{}},ans=[]){
  const g=GATES[gk];ME.status='learning';ME.attempts[gk]++;ME.scores[gk]=Math.max(ME.scores[gk]??0,score);if(gk==='G1')ME.g1=score;
  if(score>=g.pass&&integ.score>=40){ME.status='review';ME.review={gate:gk,score,integ,ans:ans.length?ans:CONTENT.bank[g.bank].slice(0,4).map(q=>({q,choice:q.answer,ms:4000}))};
    mail('Verification needed',[coachOf(ME,'mentor').email,'cc '+coachOf(ME,'hr').email],`Verification needed: ${ME.name} (${ME.code})`);mail('Result being confirmed',[ME.email],'Your assessment result is being confirmed');
    toast(`Scored ${score}%. Result held for a short check by your mentor.`)}
  else if(score>=g.pass){passGate(gk,'score');toast(`Scored ${score}%. ${g.final?'Sign-off requested.':'Next phase unlocked.'}`)}
  else if(ME.attempts[gk]>=MAX_ATTEMPTS){ME.status='hr_review';mail('HR review required',[coachOf(ME,'hr').email,coachOf(ME,'boss').email],`HR review: ${ME.name} (${ME.code}) used two attempts`);toast(`Scored ${score}%. Two attempts used; HR will meet you.`)}
  else{ME.status='coaching';coaching[ME.id]={gate:gk,score,mods,need:g.roles,dec:{},flags:integ.flags};
    mail('Coaching required',g.roles.map(r=>coachOf(ME,r).email),`Action required: 1-day coaching for ${ME.name} (${ME.code})`);
    mail('Coaching scheduled',[ME.email],'Your personalised coaching sessions are scheduled');
    toast(`Scored ${score}%. Email sent to ${g.roles.map(r=>ROLE_NAMES[r]).join(', ')}.`)}
  render()}
function passGate(gk,via){const g=GATES[gk];delete coaching[ME.id];
  if(g.final){ME.status='signoff';mail('Sign-off needed',[coachOf(ME,'mentor').email,coachOf(ME,'boss').email,coachOf(ME,'hr').email],`Sign-off needed: ${ME.name} passed Day 30 certification`);return}
  ME.phase++;ME.day=ME.phase===2?16:22;ME.status='learning';progDay=ME.day;openItem=null;
  mail('Next phase unlocked',[ME.email],via==='coach'?'Next phase unlocked on your coaches\' recommendation':'Next phase unlocked')}

// ================= actions =================
document.getElementById('main').addEventListener('click',e=>{const t=e.target;const el=t.closest('[data-go],[data-open],[data-day],[data-done],[data-dec],[data-rate],[data-withdraw]');
  if(el?.dataset.withdraw){const j=byId(+el.dataset.withdraw);joinees.splice(joinees.indexOf(j),1);toast(`${j.name} withdrawn. Seat freed.`);render();return}
  if(el?.dataset.go){page.joinee=el.dataset.go;if(el.dataset.go==='programme'){progDay=ME.day;openItem=null}render();scrollTo(0,0);return}
  if(el?.dataset.open){const [d,i]=el.dataset.open.split('-').map(Number);page.joinee='programme';progDay=d;openItem={d,i,it:CONTENT.days[d].items[i]};render();scrollTo(0,0);return}
  if(el?.dataset.day){progDay=+el.dataset.day;openItem=null;render();return}
  if(el?.dataset.done){done.add(el.dataset.done);toast('Marked complete.');render();return}
  if(el?.dataset.dec){decide(+el.dataset.t,role,el.dataset.dec);return}
  if(el?.dataset.rate!=null){rateShadow(+el.dataset.rate);return}
  switch(t.id){
   case 'backDay':openItem=null;render();return;
   case 'jfAdd':{try{const j=createJoinee({name:jf.name,email:jf.email,phone:jf.phone,dept:jf.dept,region:jf.region,exp:jfExp(),prevEmp:jf.prevEmp,prevRole:jf.prevRole,start:jf.start,boss:jf.boss||null,mentor:jf.mentor||null,added:true});
       lastAdded=j;mail('Welcome',[j.email],'Welcome to the RM Onboarding Academy');mail('New joinee assigned',[coachOf(j,'mentor').email,coachOf(j,'boss').email,'cc '+coachOf(j,'hr').email],`New joinee assigned: ${j.name} (${j.code})`);
       jf={...jf,name:'',email:'',phone:'',prevEmp:'',prevRole:'',boss:'',mentor:''};toast(`${j.name} added as ${j.code}.`);render()}catch(err){toast(err.message)}return}
   case 'jfReset':jf={name:'',email:'',phone:'',dept:'MCB',region:'North',y:'4',m:'0',prevEmp:'',prevRole:'',start:'2026-10-05',boss:'',mentor:''};lastAdded=null;render();return;
   case 'csvImport':importCSV($('#csvText').value);return;
   case 'add10':{const before=joinees.length;for(let k=0;k<10&&joinees.length<CAPACITY;k++){const i=joinees.length+100+k;try{createJoinee({name:FN[(i*3)%20]+' '+LN[(i*11)%15],email:`joinee${nextCode}@bank.example`,dept:DK[i%5],region:REGIONS[(i*7)%5],exp:37+(i*13)%23,prevEmp:PREV_E[i%6],prevRole:PREV_R[i%5],added:true})}catch(e){}}toast(`${joinees.length-before} sample joinees added and assigned.`);render();return}
   case 'startQuiz':quiz={stage:'declare'};$('#assessPanel').innerHTML=assessHTML();return;
   case 'beginQuiz':beginSecure();return;
   case 'nextQ':{const c=document.querySelector('input[name="cur"]:checked');saveAnswer(c?+c.dataset.o:null);return}
   case 'demoLearn':itemsFor(ME.phase).forEach(x=>done.add(x.key));if(ME.phase===3&&ME.shadow.length<4)demoShadow(true);ME.day=curGate().day;toast('Phase learning completed.');render();return;
   case 'failFast':if(ME.status!=='learning')return toast('The assessment is not open right now.');submit(curGate().key,curGate().pass-12,curGate().key==='G2'?{PRI:58,PNL:70}:{GOV:55,PPL:85,PRD:75,PRC:65});return;
   case 'flagFast':if(ME.status!=='learning')return toast('The assessment is not open right now.');submit(curGate().key,90,{GOV:83,PPL:100,PRD:100,PRC:83},{score:60,flags:{focus_lost:3,copy_paste:1}});return;
   case 'passFast':if(ME.status!=='learning')return toast('The assessment is not open right now.');if(curGate().final&&ME.shadow.filter(s=>s.state==='approved').length<4)demoShadow(true);submit(curGate().key,88,{PRI:90,PNL:85});return;
   case 'finishRem':ME.repeat.forEach(m=>itemsFor(1).concat(itemsFor(2)).filter(x=>CONTENT.days[x.d].m===m).forEach(x=>done.add(x.key)));ME.status='learning';ME.repeat=null;toast(`Refresher complete. Attempt 2 of 2 is open.`);render();return;
   case 'pulseSend':mail('Pulse received',[coachOf(ME,'hr').email],`Pulse from ${ME.code} (HR only)`);toast('Thanks. Your HR partner sees this, not your mentor or boss.');return;
   case 'shSave':{const ref=$('#sh_ref').value.trim(),obs=$('#sh_obs').value.trim();
     if(/\b[A-Z]{5}\d{4}[A-Z]\b|\b\d{9,18}\b|\b\d{4}\s?\d{4}\s?\d{4}\b/.test(ref+' '+obs))return toast('Remove PAN, Aadhaar or account numbers. Use the masked client reference only.');
     if(obs.length<30)return toast('Describe the interaction in at least 30 characters.');
     ME.shadow.push({day:+$('#sh_day').value,ref,type:$('#sh_type').value,obs,refl:$('#sh_refl').value.trim()||'—',state:'pending'});toast('Saved and sent to your mentor.');render();return}
   case 'shDemo':demoShadow(false);render();return;
   case 'confirmRes':case 'voidRes':{const n=($('#vivaNotes')?.value||'').trim();if(n.length<30){toast('Add at least 30 characters describing the conversation.');return}
     const gk=ME.review.gate;
     if(t.id==='confirmRes'){ME.review=null;passGate(gk,'score');integrityStats.confirmed++;toast(`Result confirmed for ${first(ME.name)}.`)}
     else{ME.review=null;ME.status='learning';ME.supervised=true;ME.attempts[gk]--;delete ME.scores[gk];integrityStats.voided++;mail('Result voided',[coachOf(ME,'hr').email,coachOf(ME,'boss').email],`Assessment result voided: ${ME.name} (${ME.code})`);toast('Result voided. Supervised re-sit booked; HR notified for a conduct review.')}
     integrityStats.held++;render();return}
   case 'hrExtend':case 'hrExit':{if(($('#hrNotes')?.value||'').trim().length<30)return toast('Add at least 30 characters of decision notes.');
     if(t.id==='hrExtend'){ME.attempts[curGate().key]=MAX_ATTEMPTS-1;ME.status='learning';toast('Extended by one week with one more attempt.')}else{ME.status='hr_review';toast('Recorded. HR will start the role-change or exit process.')}render();return}
   case 'saveViva':ME.viva=+$('#finViva').value;if(ME.viva<3){toast('Viva below 3: sign-off is blocked. Plan further coaching.');}else toast('Viva recorded.');render();return;
   case 'signYes':ME.sign[role]=true;if(['mentor','boss','hr'].every(r=>ME.sign[r])){ME.status='certified';ME.day=30;mail('Certified',[ME.email,coachOf(ME,'mentor').email,coachOf(ME,'boss').email,coachOf(ME,'hr').email],`${ME.name} is now a certified Relationship Manager`);toast(`${first(ME.name)} is certified.`)}else toast('Signed. Waiting for the other signatories.');render();return;
   case 'signNo':ME.status='hr_review';toast('Referred to HR review.');render();return;
  }
  if(role==='joinee'&&page.joinee==='programme'&&t.closest('.calc'))return;
});
document.getElementById('main').addEventListener('change',e=>{const id=e.target.id||'';
  if(id.startsWith('jf_')){const k=id.slice(3);jf[k]=e.target.value;if(k==='dept'){jf.boss='';jf.mentor=''}if(['dept','region','y','m','boss','mentor'].includes(k))render();}
  if(id==='rosterDept'){rosterDept=e.target.value;render()}
  if(id==='csvFile'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{$('#csvText').value=r.result;toast('File loaded. Check the rows, then Import rows.')};r.readAsText(e.target.files[0])}});
document.getElementById('main').addEventListener('input',e=>{const id=e.target.id||'';if(id.startsWith('jf_')&&e.target.tagName==='INPUT')jf[id.slice(3)]=e.target.value;if(id==='rosterQ'){rosterQ=e.target.value;const pos=e.target.selectionStart;render();const q=$('#rosterQ');q.focus();q.setSelectionRange(pos,pos)}if(e.target.id==='honour')$('#beginQuiz').disabled=!e.target.checked;if(e.target.name==='cur')$('#nextQ').disabled=false;if(e.target.id?.startsWith('c_')&&openItem?.it.ref)CALC[openItem.it.ref.slice(5)].run()});

function decide(id,r,d){const c=coaching[id],notes=($('#n_'+id)?.value||'').trim();
  if(notes.length<30){toast('Add at least 30 characters of notes before recording a decision.');$('#n_'+id)?.focus();return}
  const mods=Object.keys(c.mods).filter(m=>$(`#m_${id}_${m}`)?.checked);c.dec[r]={d,notes,mods:d==='repeat'?mods:[]};
  const pending=c.need.filter(x=>!c.dec[x]);const t=byId(+id);
  if(pending.length){toast(`Recorded. Waiting for ${pending.map(x=>ROLE_NAMES[x]).join(' and ')}.`);render();return}
  if(c.need.some(x=>c.dec[x].d==='repeat')){const rep=[...new Set(c.need.flatMap(x=>c.dec[x].mods))];const list=rep.length?rep:Object.keys(c.mods).filter(m=>c.mods[m]<70);
    if(id===ME.id){ME.status='remediation';ME.repeat=list;list.forEach(m=>itemsFor(1).concat(itemsFor(2)).filter(x=>CONTENT.days[x.d].m===m).forEach(x=>done.delete(x.key)))}else t.status='remediation';
    delete coaching[id];mail('Refresher assigned',[byId(id).email],'Refresher modules assigned');toast(`All coaches decided: ${first(t.name)} repeats ${list.join(', ')}.`)}
  else{if(id===ME.id)passGate(c.gate,'coach');else{t.status='phase2';delete coaching[id];mail('Next phase unlocked',[byId(id).email],'Next phase unlocked on coaches\' recommendation')}toast(`All coaches passed ${first(t.name)}. Next phase unlocked.`)}
  render()}
function rateShadow(ix){const s=V.mentor._pending()[ix];const r=COMPETENCIES.map((_,ci)=>+$(`#rt_${ix}_${ci}`).value);s.own.state='approved';s.own.avg=r.reduce((a,b)=>a+b,0)/r.length;s.own.fb=$('#fb_'+ix).value.trim();toast(`Approved with an average rating of ${s.own.avg.toFixed(1)}.`);render()}
function demoShadow(approve){const S=[['Client visit','Mentor ran a discovery meeting with the CFO of a ₹300 Cr pharma distributor; mapped cash cycle and a payables pain point.'],['Credit discussion','Renewal discussion; DSCR dropped to 1.15x. Mentor explained the covenant and agreed a quarterly stock-statement plan.'],['KYC review','Periodic KYC for a high-risk trading client. Found a new 12% shareholder; mentor paused the renewal until BO documents arrived.'],['Pricing discussion','Client asked for 40 bps below card. Mentor offered CMS and payroll to lift relationship RoE instead.']];
  S.forEach(([ty,o],k)=>ME.shadow.push({day:22+k*2,ref:'CL-'+Math.random().toString(36).slice(2,6).toUpperCase(),type:ty,obs:o,refl:'I would summarise the next steps in writing the same day.',state:approve?'approved':'pending',avg:approve?4:undefined,fb:approve?'Good observation of the client’s real need.':undefined}));
  if(!approve)toast('4 sample logs sent to your mentor. Switch to Mentor → Shadow reviews to rate them.')}

// behaviour capture during tests
document.addEventListener('visibilitychange',()=>{if(document.hidden)rec('focus_lost')});
window.addEventListener('blur',()=>{if(!document.hidden)rec('focus_lost')});
['copy','paste','cut'].forEach(k=>document.addEventListener(k,e=>{if(quiz?.stage==='q'){e.preventDefault();rec('copy_paste')}}));
document.addEventListener('contextmenu',e=>{if(quiz?.stage==='q')e.preventDefault()});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&quiz?.stage==='q')rec('fullscreen_exit')});

// ================= Academy Assistant (grounded in the training content) =================
const KB=[];Object.entries(CONTENT.days).forEach(([d,v])=>v.items.forEach(it=>{if(it.md)it.md.split(/\n(?=## )/).forEach(sec=>{const h=(sec.match(/^#+\s*(.+)/)||[,it.t])[1];if(sec.replace(/^#.*$/gm,'').trim().length>60)KB.push({day:+d,title:it.t,h,text:sec})})}));
KB.push({day:0,title:'Programme rules',h:'Gates, pass marks, score below 80% or 75%, fail, coaching, repeat, attempts',text:`Days 1-14 Foundation (Governance, People, Product, Process). Day 15 Gate 1, pass 80%. Below 80%: email to Mentor, Reporting Boss and HR; each gives one coaching day; then pass or repeat named modules. Days 16-20 Product Pricing and P&L. Day 21 Gate 2, pass 75%; below that Mentor and Reporting Boss coach, then pass or repeat. Days 22-29 shadowing real clients with the mentor; 4 approved shadow logs needed. Day 30 certification assessment (80%), mentor viva, and sign-off by Mentor, Reporting Boss and HR. Two attempts per gate; a second miss goes to HR review. During tests the assistant is paused; unusual activity leads to a short verification conversation, never an automatic fail.`});
KB.push({day:0,title:'Coach guide',h:'Running a coaching day and a viva',text:`Coaching day: review module scores, pick the two weakest areas, work through real cases, ask the trainee to explain answers aloud, then record notes (30+ characters) and Pass or Repeat with named modules. Verification viva (held results): 20 minutes, ask the trainee to explain 3-4 of their test answers in their own words; confirm if they can, void if they cannot. Day-30 viva: price a facility, walk through a KYC red flag, explain a relationship P&L; score 1-5, 3 or more to approve.`});
const STOP=new Set('the a an of to and or in on for is are what how why when do i my me it be with at by from about can you your this that which'.split(' '));
const toks=s=>s.toLowerCase().replace(/[^a-z0-9₹%\s-]/g,' ').split(/\s+/).filter(w=>w.length>1&&!STOP.has(w));
function retrieve(q,k=3){const qt=toks(q);return KB.map(c=>{const set=new Set(toks(c.h+' '+c.title+' '+c.text)),hs=new Set(toks(c.h)),ts=new Set(toks(c.title));let s=0;qt.forEach(w=>{if(set.has(w))s+=1+(hs.has(w)?2:0)+(ts.has(w)?0.5:0)});return {c,s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,k).map(x=>x.c)}
const chat={msgs:[],busy:false};let samplerP=null;
const CHIPS={joinee:['What happens if I score below 80%?','Explain drawing power with an example','How is RAROC calculated?','When is KYC refresh due for high-risk clients?'],
 mentor:['How do I run a verification viva?','What should a coaching day cover?','What does SMA-1 mean?'],boss:['What should a coaching day cover?','What are an RM\'s KRAs?','How is relationship RoE calculated?'],hr:['What are the gate rules?','How do I run a verification viva?','What does POSH require?']};
function mountChat(box){if(!box)return;box.innerHTML=`<div class="msgs"></div><div class="chips">${(CHIPS[role]||CHIPS.joinee).map(c=>`<button class="chip" type="button">${esc(c)}</button>`).join('')}</div><form class="chat-in"><input placeholder="Ask about KYC, pricing, the gates…" autocomplete="off" aria-label="Your question"><button class="btn btn-primary">Send</button></form>`;
  const m=box.querySelector('.msgs');if(!chat.msgs.length)chat.msgs.push({r:'a',t:`Hi. I answer from the Academy's training content and name the source. Please never paste client names, PAN or account numbers.`});
  chat.msgs.forEach(x=>m.appendChild(bubble(x)));m.scrollTop=1e9;
  box.querySelector('.chips').onclick=e=>{if(e.target.classList.contains('chip'))ask(e.target.textContent,box)};
  box.querySelector('form').onsubmit=e=>{e.preventDefault();const i=box.querySelector('input');const v=i.value.trim();if(v){i.value='';ask(v,box)}}}
function bubble(x){const d=document.createElement('div');d.className='msg '+(x.r==='u'?'u':'a');d.textContent=x.t;if(x.src){const s=document.createElement('span');s.className='src';s.textContent='Source: '+x.src;d.appendChild(s)}return d}
async function ask(q,box){if(chat.busy)return;const m=box.querySelector('.msgs');const push=x=>{chat.msgs.push(x);const b=bubble(x);m.appendChild(b);m.scrollTop=1e9;return b};
  push({r:'u',t:q});
  if(ME.testOpen&&role==='joinee'){rec('assistant_during_test');push({r:'a',t:'The Academy Assistant is paused while your assessment is in progress.'});return}
  const clean=q.replace(/\b[A-Z]{5}\d{4}[A-Z]\b/g,'[PAN]').replace(/\b\d{4}\s?\d{4}\s?\d{4}\b/g,'[AADHAAR]').replace(/\b\d{9,18}\b/g,'[ACCOUNT]');
  const hits=retrieve(clean);const src=hits.map(h=>h.day?`Day ${h.day} · ${h.title}`:h.title).filter((v,i,a)=>a.indexOf(v)===i).join('; ');
  const msg={r:'a',t:'Thinking…'};const el=push(msg);chat.busy=true;
  try{const sample=await (samplerP||(samplerP=window.claude?.use?window.claude.use('sample'):Promise.resolve(null)));if(!sample)throw 0;
    const who={joinee:`a new Relationship Manager on Day ${ME.day} (status ${ME.status})`,mentor:'a mentor (senior RM) coaching new RMs',boss:'a reporting boss (cluster head)',hr:'an HR partner running the programme'}[role];
    const prompt=`You are the RM Onboarding Academy assistant for a large Indian private-sector corporate bank. The user is ${who}. Answer briefly and professionally using ONLY the CONTEXT. For calculations show formula, working and answer in ₹ lakh / ₹ Cr. Never give assessment answers. Refuse to handle customer personal data. If the context does not cover the question, say so and suggest asking the mentor or HR.\n\nCONTEXT:\n${hits.map(h=>`[${h.day?'Day '+h.day+' · ':''}${h.title}]\n${h.text}`).join('\n\n').slice(0,6000)||'(nothing relevant found)'}\n\nQUESTION: ${clean}`;
    const past=chat.msgs.slice(1,-2).slice(-6).map(x=>({role:x.r==='u'?'user':'assistant',content:x.t}));while(past.length&&past[0].role!=='user')past.shift();
    const r=await sample([...past,{role:'user',content:prompt}],{modelTier:'quick',cache:false,onText:({text})=>{el.firstChild.textContent=text}});
    msg.t=r.text;el.firstChild.textContent=r.text}
  catch(_){msg.t=hits.length?`Here is what the programme says (${hits[0].h}):\n\n`+hits[0].text.replace(/^#+.*\n/,'').replace(/[#*`|]/g,'').replace(/\n{2,}/g,'\n').trim().slice(0,700):'I could not find that in the training content. Please ask your mentor or HR partner.';el.firstChild.textContent=msg.t}
  if(hits.length){msg.src=src;const s=document.createElement('span');s.className='src';s.textContent='Source: '+src;el.appendChild(s)}
  chat.busy=false}
$('#fab').onclick=()=>{const d=$('#drawer');d.hidden=!d.hidden;if(!d.hidden)mountChat($('#drawerChat'))};
$('#closeChat').onclick=()=>$('#drawer').hidden=true;

render();
