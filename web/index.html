<title>RM Onboarding Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: left rail = who you are + your menu; one quiet workspace; ink-blue accent only where you can act. Tokens mirror the RM Academy design system. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sunken:#EEF1F4; --line:#DDE2E8; --line-strong:#C6CDD6;
  --ink:#16223A; --text:#27313F; --muted:#5E6878; --faint:#8A93A1;
  --accent:#1F4E79; --accent-soft:#E6EDF5; --on-accent:#FFFFFF;
  --good:#2E7457; --good-soft:#E4F1EA; --warn:#9A6412; --warn-soft:#F7EEDD; --crit:#A8321F; --crit-soft:#F7E4E0;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r-sm:4px; --r-md:6px; --r-lg:10px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10151D; --surface:#171E28; --sunken:#1D2531; --line:#2A3441; --line-strong:#3A4555;
  --ink:#E8EDF3; --text:#D3DAE3; --muted:#9AA5B4; --faint:#6F7A89;
  --accent:#7FA8D6; --accent-soft:#1F2F44; --on-accent:#0E1520;
  --good:#6DBB95; --good-soft:#193127; --warn:#D9A554; --warn-soft:#33281A; --crit:#E0806E; --crit-soft:#3A201B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10151D; --surface:#171E28; --sunken:#1D2531; --line:#2A3441; --line-strong:#3A4555;
  --ink:#E8EDF3; --text:#D3DAE3; --muted:#9AA5B4; --faint:#6F7A89;
  --accent:#7FA8D6; --accent-soft:#1F2F44; --on-accent:#0E1520;
  --good:#6DBB95; --good-soft:#193127; --warn:#D9A554; --warn-soft:#33281A; --crit:#E0806E; --crit-soft:#3A201B; color-scheme:dark }
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.55;margin:0}
h1,h2,h3{font-family:var(--f-display);color:var(--ink);text-wrap:balance;margin:0;font-weight:600}
h1{font-size:1.6rem;line-height:1.2} h2{font-size:1.2rem;line-height:1.3} h3{font-size:.95rem;font-family:var(--f-body)}
p{margin:0} .muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums} .small{font-size:.8rem}
.mono{font-family:var(--f-mono);font-size:.8rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding-block:var(--s5);padding-inline:var(--s4);display:flex;flex-direction:column;gap:var(--s4);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;gap:var(--s3);align-items:center}
.mark{width:34px;height:34px;border-radius:var(--r-md);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;flex:none}
.brand b{display:block;color:var(--ink);font-size:.95rem;line-height:1.2}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunken);padding:4px;border-radius:var(--r-md)}
.roles button{all:unset;cursor:pointer;text-align:center;font-size:.78rem;padding:6px 4px;min-height:32px;display:grid;place-items:center;line-height:1.2;border-radius:var(--r-sm);color:var(--muted)}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.who{display:flex;flex-direction:column;gap:2px;padding:var(--s3);border:1px solid var(--line);border-radius:var(--r-md)}
.who b{color:var(--ink);font-size:.9rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-md)}
.nav button:hover{background:var(--sunken)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{font-size:.7rem;min-width:20px;text-align:center;padding:1px 6px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.rail-foot{margin-top:auto;font-size:.72rem;color:var(--faint)}

main{padding-block:var(--s6);padding-inline:clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:var(--s5);min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s4);flex-wrap:wrap}
.head .sub{max-width:64ch;margin-top:6px;color:var(--muted)}
.grid{display:grid;gap:var(--s4)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-side{grid-template-columns:280px minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.panel.tight{padding:var(--s4);gap:var(--s3)}
.panel.inner{background:var(--bg)}
.panel.hold{border-color:var(--warn)}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.stat{padding:var(--s4) var(--s5);gap:4px}
.stat .v{font-size:1.7rem;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .d{font-size:.8rem;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)} .p-info{background:var(--accent-soft);color:var(--accent)} .p-mute{background:var(--sunken);color:var(--muted)}
.btn{cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-md);padding:7px 14px;font-weight:500}
.btn:hover{background:var(--sunken)}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:4px 10px;font-size:.8rem}
.row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:var(--s3)}

table{border-collapse:collapse;width:100%;font-size:.85rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.tscroll{overflow-x:auto}

.journey{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:3px}
.day{aspect-ratio:1/1.35;border-radius:3px;background:var(--sunken);display:grid;place-items:end center;font-size:.62rem;color:var(--faint);padding-bottom:2px}
.day.done{background:var(--accent);color:var(--on-accent);opacity:.85}
.day.today{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft);color:var(--accent);font-weight:600;opacity:1}
.day.gate{background:var(--warn-soft);color:var(--warn);font-weight:600}
.day.gate.done{background:var(--good);color:var(--on-accent)}
.phases{display:grid;grid-template-columns:15fr 6fr 9fr;gap:3px;font-size:.75rem;color:var(--muted)}
.phases div{border-top:2px solid var(--line-strong);padding-top:4px}

.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{cursor:pointer} .item .t:hover b{color:var(--accent)}
.check{width:18px;height:18px;border:1.5px solid var(--line-strong);border-radius:4px;display:grid;place-items:center;background:var(--surface);font-size:.7rem}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kind{font-size:.68rem;font-family:var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}

.daylist{display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow-y:auto}
.daylist .ph{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.daylist button{all:unset;cursor:pointer;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px;border-radius:var(--r-md);font-size:.85rem}
.daylist button:hover{background:var(--sunken)}
.daylist button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.daylist button[disabled]{opacity:.5;cursor:not-allowed}
.daylist .dn{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
.daylist .tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.panel>.btn,.stack>.btn{align-self:flex-start}

.reader{max-width:72ch;display:flex;flex-direction:column;gap:12px;font-size:.93rem}
.reader h1{font-size:1.35rem} .reader h2{font-size:1.08rem;margin-top:8px} .reader h3{font-size:.95rem}
.reader ul,.reader ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.reader pre{background:var(--sunken);padding:12px;border-radius:var(--r-md);overflow-x:auto;font-family:var(--f-mono);font-size:.8rem;margin:0}
.reader code{font-family:var(--f-mono);font-size:.84em;background:var(--sunken);padding:1px 4px;border-radius:3px}
.reader pre code{background:none;padding:0}

.bar{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:140px minmax(0,1fr) 48px;gap:var(--s3);align-items:center;font-size:.85rem}
.hbar .track{height:14px;background:var(--sunken);border-radius:3px;overflow:hidden}
.hbar .track i{display:block;height:100%}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
label.f input,label.f select,textarea{border:1px solid var(--line-strong);border-radius:var(--r-md);padding:7px 10px;background:var(--surface);color:var(--text);font-size:.9rem}
textarea{width:100%;min-height:80px;resize:vertical}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--s3)}
.out{display:flex;flex-direction:column;gap:2px;padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--sunken)}
.out .v{font-size:1.2rem;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

.quiz-q{display:flex;flex-direction:column;gap:var(--s2)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer}
.opt:hover{background:var(--sunken)}
.opt input{margin-top:3px;accent-color:var(--accent)}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.olist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.olist li::marker{color:var(--accent);font-weight:600}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:var(--s3) var(--s4);border-radius:0 var(--r-md) var(--r-md) 0;font-size:.88rem}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.mail{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:2px;font-size:.84rem}
.mail .to{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);overflow-wrap:anywhere}
.bars4{display:flex;gap:var(--s4);flex-wrap:wrap} .bars4>div{min-width:80px;flex:1}

/* chat */
.chat{display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow-y:auto;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.msg{max-width:88%;padding:9px 12px;border-radius:var(--r-lg);font-size:.87rem;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--sunken);border-bottom-left-radius:3px}
.msg .src{display:block;margin-top:6px;font-size:.72rem;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 var(--s4) var(--s2)}
.chip{cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:.75rem}
.chat-in{display:flex;gap:var(--s2);padding:var(--s3);border-top:1px solid var(--line)}
.chat-in input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:var(--r-md);padding:8px 10px;background:var(--surface)}
.chatpage{height:min(640px,calc(100vh - 180px));padding:0;gap:0}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;border-radius:99px;padding:11px 18px;box-shadow:0 6px 20px rgba(16,24,40,.18)}
.drawer{position:fixed;right:20px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 32px));height:min(560px,calc(100vh - 120px));background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:0 12px 40px rgba(16,24,40,.22);display:flex;flex-direction:column;z-index:21}
.drawer header{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-md);font-size:.85rem;z-index:30;max-width:calc(100vw - 32px)}
.testing .g-main{grid-template-columns:minmax(0,1fr)} .testing .hide-in-test{display:none!important} .testing .fab{display:none}

@media (max-width:1000px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g-main,.g3,.g-side{grid-template-columns:minmax(0,1fr)} .daylist{max-height:260px} }
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:var(--s3);gap:var(--s3)}
  .nav{flex-direction:row;overflow-x:auto} .nav button{white-space:nowrap} .rail-foot,.who{display:none} .roles{grid-template-columns:repeat(4,1fr)}
  .g2{grid-template-columns:minmax(0,1fr)} .hbar{grid-template-columns:100px minmax(0,1fr) 44px}
  .journey{grid-template-columns:repeat(15,minmax(0,1fr))} .phases{display:none}
}
@media (max-width:440px){ .g4{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:no-preference){ .bar i,.hbar .track i{transition:width .4s ease} }
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><div class="mark">RM</div><div><b>Onboarding Academy</b><span class="eyebrow">Corporate Banking</span></div></div>
    <div>
      <div class="eyebrow" style="margin-bottom:6px">Viewing as</div>
      <div class="roles" id="roles" role="group" aria-label="Interface">
        <button data-r="joinee">New Joinee</button><button data-r="mentor">Mentor</button>
        <button data-r="boss">Reporting Boss</button><button data-r="hr">HR</button>
      </div>
    </div>
    <div class="who" id="who"></div>
    <nav class="nav" id="nav" aria-label="Menu"></nav>
    <div class="rail-foot">Prototype with demo data. In production each person signs in with bank SSO and sees only their own interface.</div>
  </aside>
  <main id="main"></main>
</div>
<button class="btn btn-primary fab" id="fab">Ask the Academy</button>
<div class="drawer" id="drawer" hidden>
  <header><div><h3>Academy Assistant</h3><span class="muted small">Answers from the training programme</span></div><button class="btn btn-sm" id="closeChat">Close</button></header>
  <div class="chat" id="drawerChat" style="flex:1"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const CONTENT={"days": {"1": {"m": "GOV", "items": [{"t": "Bank structure & how the corporate bank earns", "k": "read", "md": "# Day 1 — The bank, the corporate bank and how it makes money\n**Pillar:** Governance · **Time:** 60 min · **Outcome:** explain where an RM sits and what drives value.\n\n## How a large private bank is organised\n- **Business units:** Corporate & Commercial Banking (large, mid, emerging corporates), Retail, Treasury, Transaction Banking.\n- **Control functions (independent of business):** Credit Risk, Compliance, Internal Audit, Operations, Legal, Finance.\n- **Three lines of defence:** (1) business owns risk — that is you, the RM; (2) risk & compliance set and monitor limits; (3) internal audit gives independent assurance.\n\n## How the corporate bank earns\n| Source | Examples | Capital intensive? |\n|---|---|---|\n| Net interest income (NII) | Cash credit, WCDL, term loans | Yes |\n| Float / liability income | Current accounts, CMS, payroll, escrow | No |\n| Fee income | LC, BG, processing fees, syndication | Low |\n| Treasury income | FX conversion, hedges | Low |\n\n**Key idea:** the best relationships combine credit with fee and float products — this lifts return on capital (you will calculate this on Day 19).\n\n## Your first week checklist\n1. Complete system access requests (CRM, LOS, email) — maker-checker access is granted only after Day 21.\n2. Meet your mentor and reporting manager; agree weekly 30-minute check-ins.\n3. Read the code of conduct and sign the declaration.\n", "src": "01-governance/day01-bank-structure.md"}, {"t": "Code of conduct, conflicts, gifts & whistleblowing", "k": "read", "md": "# Day 1 — Code of conduct, conflicts and whistleblowing\n## Principles\nAct honestly, in the client's legitimate interest and the bank's, within the law. When in doubt: **pause, ask, record.**\n\n## Conflicts of interest\n- Declare any personal or family relationship with a client, vendor or colleague in a reporting line.\n- Never approve, recommend or influence a decision where you have a personal interest.\n- Outside employment, directorships and investments in client companies need prior approval.\n\n## Gifts and hospitality\n- Token gifts within the policy limit: accept and **declare in the gift register**.\n- Anything above the limit, cash or cash-equivalents, or **anything offered while a decision is pending**: decline politely and report.\n\n## Whistleblowing\nConcerns about fraud, mis-selling or misconduct can be raised through the vigil mechanism, anonymously if needed. Retaliation against a whistleblower is itself misconduct.\n\n## Consequence management\nBreaches are handled through the staff accountability framework and may lead to disciplinary action — and regulators can hold individuals accountable.\n", "src": "01-governance/day01-code-of-conduct.md"}]}, "2": {"m": "GOV", "items": [{"t": "Regulatory map: RBI, PMLA, FEMA, SEBI, DPDP", "k": "read", "md": "# Day 2 — The regulatory map for a corporate RM\nAlways check the **latest RBI Master Directions** and the bank's internal policies; this page is an orientation, not the rulebook.\n\n## Who regulates what\n| Regulator / law | Why it matters to an RM |\n|---|---|\n| **RBI** (Banking Regulation Act) | Lending norms, KYC Master Direction, IRACP (asset classification), interest-rate directions, fair practices code |\n| **PMLA 2002 & PML Rules** | KYC, beneficial ownership, CTR/STR reporting to FIU-IND |\n| **FEMA 1999** | Forex transactions, ECBs, export/import payments, hedging eligibility |\n| **SEBI** | Listed-client disclosures, insider information in the bank's possession |\n| **DPDP Act 2023** | Lawful, purpose-limited processing of personal data |\n| **Companies Act / IBC** | Charges, directors, insolvency process |\n\n## Rules you will use weekly\n- **KYC periodic updation:** high-risk every 2 years, medium every 8, low every 10.\n- **Beneficial owner (company):** natural person with more than 10% ownership or control.\n- **CTR:** cash transactions above ₹10 lakh (or connected series in a month); **STR:** within 7 working days of the suspicion conclusion.\n- **Asset classification:** SMA-0 (1–30 days overdue), SMA-1 (31–60), SMA-2 (61–90), NPA (> 90).\n", "src": "01-governance/day02-regulatory-map.md"}, {"t": "KYC / beneficial ownership checklist", "k": "worksheet", "csv": [["Section", "Item", "Required for", "Verified (Y/N)", "Remarks"], ["Entity", "Certificate of incorporation", "All companies", "", ""], ["Entity", "PAN of entity", "All", "", ""], ["Entity", "Memorandum & Articles of Association", "Companies", "", ""], ["Entity", "Board resolution authorising account opening", "Companies", "", ""], ["Entity", "GST registration", "Where applicable", "", ""], ["Beneficial ownership", "List of natural persons holding >10% (company)", "Companies", "", ""], ["Beneficial ownership", "KYC of each beneficial owner", "All", "", ""], ["Authorised signatories", "Officially valid document and PAN for each signatory", "All", "", ""], ["Screening", "Sanctions list screening completed", "All", "", ""], ["Screening", "PEP screening completed", "All", "", ""], ["Screening", "Adverse media check", "All", "", ""], ["Risk", "Customer risk category assigned (Low/Medium/High)", "All", "", ""], ["Risk", "Next periodic KYC date set (High 2y / Medium 8y / Low 10y)", "All", "", ""], ["Approval", "Maker-checker completed", "All", "", ""]], "src": "working-files/kyc-checklist.csv"}]}, "3": {"m": "GOV", "items": [{"t": "AML red flags: case vignettes", "k": "case", "md": "# Day 3 — AML red flags: case vignettes\nFor each case: identify the red flag, what you do, and whom you inform. Discuss with your mentor.\n\n## Case 1 — Structured cash\nA trading firm deposits ₹9.5 lakh in cash on four consecutive days. **Flag:** structuring below thresholds. **Action:** do not advise the client on thresholds; escalate for STR review.\n\n## Case 2 — Circular trading\nLarge receipts from three entities that share a registered address with the client, immediately paid out to a fourth. **Flag:** round-tripping. **Action:** escalate; review group structure and beneficial ownership.\n\n## Case 3 — Unexplained third-party payments\nExport proceeds arrive from a country unrelated to the stated buyer. **Flag:** trade-based money laundering / FEMA concern. **Action:** seek documents; route to trade compliance.\n\n## Case 4 — Reluctant beneficial owner\nPromoter refuses to disclose who holds 30% through an offshore trust. **Action:** onboarding cannot proceed without BO identification.\n\n## Case 5 — Sudden turnover spike\nDormant current account shows turnover jumping 20× with no business rationale. **Action:** enquire, record, escalate.\n\n**Golden rule:** never tip off the client that a report is being considered.\n", "src": "01-governance/day03-aml-cases.md"}, {"t": "Data privacy (DPDP Act 2023) & information security", "k": "read", "md": "# Day 3 — Data privacy and information security\n## DPDP Act 2023 essentials for RMs\n- Use personal data only for the **purpose** it was collected for, with **consent** or a legitimate use.\n- Collect the **minimum** needed; keep it only as long as needed.\n- Individuals have rights to access, correct and erase; breaches must be reported through the bank's incident process.\n\n## Daily do's and don'ts\n| Do | Don't |\n|---|---|\n| Use bank-approved channels and devices | Forward client data to personal email or WhatsApp |\n| Lock your screen; clear desk | Photograph documents on your phone |\n| Use the secure upload link for client documents | Share CIF lists with vendors without an approved contract |\n| Report phishing and lost devices immediately | Paste client data into public AI tools |\n\nThe Academy assistant automatically masks PAN, Aadhaar and account numbers — but you should never paste them in the first place.\n", "src": "01-governance/day03-data-privacy.md"}]}, "4": {"m": "PPL", "items": [{"t": "The RM role, KRAs and a day in the life", "k": "read", "md": "# Day 4 — The Relationship Manager role\n## What you own\n- **Revenue:** NII, fees, float across your portfolio.\n- **Risk:** portfolio quality, early warning signals, timely renewals, KYC currency.\n- **Client experience:** turnaround times, complaint closure, NPS.\n\n## Typical KRAs (confirm with your manager)\n| KRA | Weight | Example metric |\n|---|---|---|\n| Portfolio growth | 30% | Net new limits and balances |\n| Revenue & RAROC | 25% | Relationship income vs plan; RAROC ≥ hurdle |\n| Asset quality | 20% | No slippage; zero overdue renewals |\n| Compliance & hygiene | 15% | KYC current; zero audit findings |\n| Client experience | 10% | Complaints closed within TAT |\n\n## A day in the life\nMorning: EWS dashboard and overdue list → client calls/visits → afternoon: credit notes, internal coordination → CRM updates before close.\n", "src": "02-people/day04-rm-role.md"}, {"t": "Internal stakeholder map", "k": "worksheet", "csv": [["Function", "Contact name", "What they do for your client", "Typical turnaround", "When to involve", "Escalation point"], ["Credit Risk", "", "Assesses and recommends limits", "", "New limits / renewals / deviations", ""], ["Credit Administration", "", "Documentation & limit set-up", "", "Post sanction", ""], ["Operations", "", "Account opening / disbursement", "", "Onboarding / transactions", ""], ["Trade Finance", "", "LC / BG / bills", "", "Import-export needs", ""], ["Treasury Sales", "", "FX & hedging", "", "Currency exposure", ""], ["Transaction Banking", "", "CMS / payroll / SCF", "", "Collections / payables", ""], ["Compliance", "", "KYC / AML guidance", "", "Any red flag", ""], ["Legal", "", "Security documents", "", "Complex security / disputes", ""]], "src": "working-files/stakeholder-map.csv"}]}, "5": {"m": "PPL", "items": [{"t": "Consultative conversations: discovery & objections", "k": "simulation", "md": "# Day 5 — Consultative conversations (simulation)\n## Discovery framework\n1. **Business:** what they make, sell, to whom; seasonality.\n2. **Cash cycle:** debtor days, inventory days, creditor days.\n3. **Growth:** capex, new markets, acquisitions.\n4. **Pain:** delays, costs, forex exposure, collections.\n5. **Decision makers:** CFO, promoter, treasury head.\n\n## Objection handling — the bank next door offers 50 bps less\nAcknowledge → clarify what is being compared → reframe on total relationship value (TAT, CMS, forex, advisory) → offer a structured proposal → never commit pricing outside your authority.\n\n## Role-play (with mentor)\nScenario: CFO of a ₹400 Cr auto-component maker unhappy with current bank's slow LC processing. Run a 15-minute discovery; mentor scores you on the shadowing rubric.\n", "src": "02-people/day05-consultative-selling.md"}, {"t": "POSH, diversity & respectful workplace", "k": "read", "md": "# Day 5 — Respectful workplace (POSH, diversity)\n- The Sexual Harassment of Women at Workplace Act 2013 (POSH) requires an **Internal Committee**; complaints can be raised with it confidentially.\n- Harassment includes unwelcome physical, verbal or non-verbal conduct, including over messaging apps and at client events.\n- Bystanders are encouraged to support and report.\n- Inclusive behaviour with clients and colleagues is part of your conduct rating.\n", "src": "02-people/day05-posh.md"}]}, "6": {"m": "PRD", "items": [{"t": "Working capital: CC, OD, WCDL, drawing power", "k": "read", "md": "# Day 6 — Working capital finance\n## Products\n- **Cash Credit (CC):** running limit against stock and receivables; interest on daily utilised balance.\n- **Overdraft (OD):** against FDs, property or cash flows.\n- **Working Capital Demand Loan (WCDL):** short tenor tranche carved out of the fund-based limit, usually cheaper.\n\n## Drawing power (DP)\n`DP = (Eligible stock + Eligible receivables − Trade creditors) × (1 − margin)`\n\n**Example:** stock ₹100 Cr, receivables ₹60 Cr, creditors ₹40 Cr, margin 25% → (100 + 60 − 40) × 0.75 = **₹90 Cr**. Utilisation is capped at the lower of limit and DP.\n\n## Assessing the limit\nUnderstand the operating cycle; banks use turnover or cash-budget methods for assessing working capital. Watch for DP inflation (old or obsolete stock, ageing receivables).\n\nUse the **DrawingPower** sheet in the working-files workbook.\n", "src": "03-product/day06-working-capital.md"}, {"t": "Drawing power calculator", "k": "worksheet", "ref": "calc:dp"}]}, "7": {"m": "PRD", "items": [{"t": "Term loans, project finance basics, DSCR", "k": "read", "md": "# Day 7 — Term loans and project finance basics\n- **Purpose:** capex, expansion, acquisitions. Tenor typically 3–10 years with moratorium.\n- **DSCR** = (PAT + depreciation + interest on term loan) ÷ (interest + principal due). Banks usually look for comfortable coverage above 1.2–1.3x; 1.0x means no cushion.\n- **Security:** hypothecation/mortgage of assets; register charges (ROC) and security interest (CERSAI within 30 days).\n- **Covenants:** leverage, DSCR, promoter holding, restrictions on dividends — formalised in the sanction letter and facility agreement.\n", "src": "03-product/day07-term-loans.md"}]}, "8": {"m": "PRD", "items": [{"t": "Trade finance: LC, BG, bill discounting, PCFC", "k": "read", "md": "# Day 8 — Trade finance\n| Product | Use |\n|---|---|\n| Import LC | Bank's undertaking to pay the seller on compliant documents |\n| Bank guarantee (performance/financial) | Contingent undertaking on client's obligation |\n| Bill discounting (LC-backed or not) | Early cash against receivables |\n| Packing credit / PCFC | Pre-shipment export finance (PCFC in foreign currency) |\n| Post-shipment credit | Finance after shipment until export proceeds arrive |\n\nNon-fund products earn **fees** and consume less capital than loans — central to relationship profitability. All trade must comply with FEMA and sanctions screening.\n", "src": "03-product/day08-trade-finance.md"}]}, "9": {"m": "PRD", "items": [{"t": "Transaction banking: CMS, payroll, supply chain finance", "k": "read", "md": "# Day 9 — Transaction banking\n- **Cash management (CMS):** collections from many locations, payables automation, liquidity sweeps, host-to-host integration.\n- **Payroll accounts:** salary for employees — float for the bank, retail cross-sell opportunity.\n- **Supply chain finance:** dealer finance (anchor's distributors) and vendor finance (anchor's suppliers).\n- **Escrow and virtual accounts** for reconciliation.\n\nWhy it matters: CMS and payroll build **low-cost current-account float** and make the relationship sticky — harder for competitors to take over.\n", "src": "03-product/day09-transaction-banking.md"}]}, "10": {"m": "PRD", "items": [{"t": "Treasury, FX hedging & liability products", "k": "read", "md": "# Day 10 — Treasury, FX hedging and liability products\n- **FX conversion:** spot, forward contracts. Importers with USD payables buy USD forward; exporters with receivables sell forward.\n- **Derivatives:** options and swaps require suitability and user-classification checks — route through treasury sales.\n- **Liability products:** current accounts, fixed deposits, sweep-in FDs. Current-account balances are valued at the FTP credit rate (Day 19).\n", "src": "03-product/day10-treasury-liabilities.md"}, {"t": "Case: facility design for Apex Auto Components", "k": "case", "md": "# Day 10 — Product-fit case: Apex Auto Components (fictional)\n**Profile:** turnover ₹420 Cr; supplies two OEMs; imports steel (USD); 180 employees on another bank's payroll; planning a ₹60 Cr new line.\n\n**Task (60 min):** propose a facility structure — working capital (CC/WCDL), import LC limit, a term loan for capex, forward cover, CMS for OEM collections, payroll migration. For each: purpose, indicative size, why it fits, risks. Present to your mentor.\n", "src": "03-product/day10-product-case.md"}]}, "11": {"m": "PRC", "items": [{"t": "Client onboarding journey & account opening", "k": "read", "md": "# Day 11 — Client onboarding journey\n1. Lead qualification and internal de-dupe.\n2. KYC and CDD: entity documents, beneficial owners, sanctions and PEP screening, risk categorisation.\n3. Account opening (maker-checker), welcome call.\n4. Credit onboarding runs in parallel (Day 12).\nTrack TAT at each stage in CRM; most client complaints in the first 90 days are about onboarding delays.\n", "src": "04-process/day11-onboarding.md"}]}, "12": {"m": "PRC", "items": [{"t": "Credit Appraisal Memo (CAM) template", "k": "worksheet", "md": "# Day 12 — Credit Appraisal Memo (CAM) template\nUse this structure for your practice CAM on Apex Auto Components.\n1. **Proposal summary** — facilities, amounts, tenor, pricing, security.\n2. **Borrower profile** — promoters, group, business model, industry outlook.\n3. **Financial analysis** — 3 years: revenue, EBITDA margin, leverage, current ratio, DSCR, cash conversion cycle.\n4. **Assessment of limits** — working capital method, DP computation, capex funding.\n5. **Risk analysis** — business, financial, management, industry; mitigants.\n6. **Security and covenants.**\n7. **Pricing and RAROC** — attach calculator output.\n8. **Compliance** — KYC status, exposure norms, deviations with approvals.\n9. **Recommendation.**\n", "src": "04-process/day12-cam-template.md"}]}, "13": {"m": "PRC", "items": [{"t": "Sanction, documentation, CERSAI & disbursement", "k": "read", "md": "# Day 13 — Sanction, documentation and disbursement\n- **Sanction letter** records terms and covenants; client accepts in writing.\n- **Documentation:** facility agreement, hypothecation/mortgage deeds, guarantees, board resolutions.\n- **Security creation:** register charge with ROC; register security interest with **CERSAI within 30 days**.\n- **Pre-disbursement conditions** verified by operations (maker-checker) before limits are set up.\n", "src": "04-process/day13-documentation.md"}]}, "14": {"m": "PRC", "items": [{"t": "Monitoring: EWS, SMA, NPA norms, renewals", "k": "read", "md": "# Day 14 — Monitoring, EWS and asset classification\n## Early warning signals\nDelayed stock statements, frequent cheque returns, persistent over-utilisation, falling credits in the account, auditor resignation, adverse news, promoter pledge increases.\n\n## Classification\n| Overdue | Status |\n|---|---|\n| 1–30 days | SMA-0 |\n| 31–60 days | SMA-1 |\n| 61–90 days | SMA-2 |\n| > 90 days | NPA |\nA CC/OD becomes NPA if **out of order continuously for 90 days**.\n\n## Renewals\nStart 60 days before due date; an overdue renewal is itself an EWS and an audit finding.\n", "src": "04-process/day14-monitoring.md"}, {"t": "Complaints, grievance redressal & CRM hygiene", "k": "read", "md": "# Day 14 — Complaints and CRM hygiene\n- Log every complaint in the grievance system, acknowledge immediately, own it to closure.\n- If unresolved within **30 days** (or rejected), the customer can approach the **RBI Integrated Ombudsman**.\n- CRM: log every meeting within 24 hours — purpose, outcome, next action. Your mentor reviews your CRM entries during shadowing.\n", "src": "04-process/day14-grievance-crm.md"}]}, "15": {"m": "GATE", "items": [{"t": "Day 15 Foundation Assessment · pass mark 80%", "k": "assessment", "ref": "gate:G1"}]}, "16": {"m": "PRI", "items": [{"t": "How loans are priced: EBLR/MCLR, FTP, spread", "k": "read", "md": "# Day 16 — How loans are priced\n`Customer rate = Benchmark (EBLR / MCLR / T-bill) + Spread`\n\nThe **spread** covers: cost of funds above benchmark, operating cost, expected credit loss, cost of capital, and profit.\n- **External benchmark (EBLR):** resets at least once every three months.\n- **Funds Transfer Pricing (FTP):** treasury charges you for funds and credits you for deposits. Your **NII = (yield − FTP) × balance**.\n\n**Example:** ₹10 Cr at 9.50%, FTP 7.00% → NII ₹25 lakh per year.\n", "src": "05-pricing-pnl/day16-pricing-basics.md"}]}, "17": {"m": "PRI", "items": [{"t": "Risk-based pricing: PD × LGD × EAD, capital, RAROC", "k": "read", "md": "# Day 17 — Risk-based pricing and RAROC\n- **Expected loss (EL) = PD × LGD × EAD.** Example: 2% × 45% × ₹50 Cr = ₹45 lakh.\n- **Capital** = RWA × capital ratio. RWA = exposure × risk weight (e.g., AAA-rated corporate 20% under the standardised approach). Example: ₹100 Cr × 20% × 11.5% = ₹2.3 Cr.\n- **RAROC** = (Income − Operating cost − EL − Tax) ÷ Capital. Compare with the bank's hurdle rate.\n\nIf RAROC is below hurdle: reprice, restructure security, or add fee and float business — or seek a documented deviation.\nPractise in the **Pricing** sheet of the workbook.\n", "src": "05-pricing-pnl/day17-raroc.md"}, {"t": "Loan pricing & RAROC calculator", "k": "worksheet", "ref": "calc:raroc"}]}, "18": {"m": "PRI", "items": [{"t": "Fee income and pricing deviations", "k": "read", "md": "# Day 18 — Fees and pricing deviations\n- **Fees:** processing (e.g., 1% of ₹20 Cr = ₹20 lakh), LC/BG commission on average utilisation, CMS charges, FX margins.\n- **Deviations:** any price below card rate needs approval from the delegated authority, with a written rationale (relationship RAROC, competitive quote, cross-sell committed). Deviations are audited — track promised cross-sell and report if it does not materialise.\n", "src": "05-pricing-pnl/day18-fees-deviations.md"}]}, "19": {"m": "PNL", "items": [{"t": "Relationship P&L: NII, fees, cost, provisions, RoE", "k": "read", "md": "# Day 19 — Relationship P&L\n```\n  Net interest income (loans)       (yield − FTP) × average balance\n+ Liability income (float)          (FTP credit − rate paid) × average CA/FD balance\n+ Fee income                        processing, LC, BG, CMS, FX\n= Total income\n− Operating cost                    (cost-to-income × income, or activity-based)\n− Expected loss                     PD × LGD × EAD\n= Profit before tax\n− Tax                               (~25.17%)\n= Profit after tax\n÷ Allocated capital                 RWA × capital ratio\n= Relationship RoE / RAROC\n```\nUse the **RelationshipPnL** sheet: change one lever at a time and see which moves RoE most.\n", "src": "05-pricing-pnl/day19-relationship-pnl.md"}, {"t": "Relationship P&L builder", "k": "worksheet", "ref": "calc:pnl"}]}, "20": {"m": "PNL", "items": [{"t": "Portfolio P&L, wallet share & cross-sell plan", "k": "simulation", "md": "# Day 20 — Portfolio P&L and wallet share (simulation)\n- **Wallet share** = your bank's revenue from the client ÷ client's total banking revenue pool.\n- Map each of your 5 practice clients: products held vs products needed; estimate uncaptured wallet.\n- Build a 90-day cross-sell plan: top 3 opportunities, owner (RM or product partner), expected income, risk.\nPresent to your reporting manager — this becomes your first portfolio plan after certification.\n", "src": "05-pricing-pnl/day20-portfolio.md"}]}, "21": {"m": "GATE", "items": [{"t": "Day 21 Pricing & P&L Assessment · pass mark 75%", "k": "assessment", "ref": "gate:G2"}]}, "22": {"m": "SHD", "items": [{"t": "Shadowing playbook & competency rubric", "k": "read", "md": "# Days 22–29 — Shadowing playbook\nYou observe and then co-lead live client interactions with your mentor. **You do not hold independent authority** — all advice, pricing and documentation is owned by the mentor.\n\n## Daily routine\n1. Morning brief with mentor: clients, objectives, your role (observe / co-lead).\n2. Interactions: calls, visits, credit discussions, KYC reviews, complaint handling.\n3. Log each interaction in the Academy (masked client reference only — never names, PAN or account numbers).\n4. Evening reflection: what went well, what you would do differently.\n\n## Competency rubric (mentor rates 1–5)\n| Competency | 5 looks like |\n|---|---|\n| Needs discovery | Uncovers cash-cycle and growth needs unprompted |\n| Product fit | Proposes a coherent multi-product structure |\n| Pricing & P&L | Explains pricing on relationship value; within authority |\n| Compliance & conduct | Spots KYC/AML/data issues and escalates correctly |\n| Communication | Clear, confident, client-centric |\n| Ownership | Follows up, updates CRM same day |\n\n**Progression:** Days 22–24 observe · 25–27 co-lead · 28–29 lead with mentor present. Target average ≥ 3.5 before Day 30.\n", "src": "06-shadowing/shadowing-playbook.md"}, {"t": "Shadow day 1: observe, log & reflect", "k": "shadow_task", "ref": "shadow"}]}, "23": {"m": "SHD", "items": [{"t": "Shadow day 2: observe, log & reflect", "k": "shadow_task", "ref": "shadow"}]}, "24": {"m": "SHD", "items": [{"t": "Shadow day 3: observe, log & reflect", "k": "shadow_task", "ref": "shadow"}]}, "25": {"m": "SHD", "items": [{"t": "Shadow day 4: observe, log & reflect", "k": "shadow_task", "ref": "shadow"}]}, "26": {"m": "SHD", "items": [{"t": "Shadow day 5: observe, log & reflect", "k": "shadow_task", "ref": "shadow"}]}, "27": {"m": "SHD", "items": [{"t": "Shadow day 6: observe, log & reflect", "k": "shadow_task", "ref": "shadow"}]}, "28": {"m": "SHD", "items": [{"t": "Shadow day 7: observe, log & reflect", "k": "shadow_task", "ref": "shadow"}]}, "29": {"m": "SHD", "items": [{"t": "Shadow day 8: observe, log & reflect", "k": "shadow_task", "ref": "shadow"}]}, "30": {"m": "GATE", "items": [{"t": "Day 30 Certification Assessment, viva & sign-off", "k": "assessment", "ref": "gate:F"}]}}, "bank": {"GATE_1": [{"module": "GOV", "stem": "To which authority does a bank file Cash Transaction Reports (CTR) and Suspicious Transaction Reports (STR)?", "options": ["Reserve Bank of India", "Financial Intelligence Unit – India (FIU-IND)", "SEBI", "Enforcement Directorate"], "answer": 1, "explanation": "Reporting entities under PMLA report CTRs and STRs to FIU-IND."}, {"module": "GOV", "stem": "For a company customer, a beneficial owner under the PML Rules is a natural person who ultimately holds an ownership interest of:", "options": ["More than 25%", "More than 10%", "More than 51%", "Any shareholding"], "answer": 1, "explanation": "The 2023 amendment lowered the threshold for companies to more than 10%."}, {"module": "GOV", "stem": "Once the Principal Officer concludes a transaction is suspicious, the STR must be filed within:", "options": ["24 hours", "7 working days", "15 days", "30 days"], "answer": 1, "explanation": "STRs are due within 7 working days of arriving at the conclusion of suspicion."}, {"module": "GOV", "stem": "A client whose loan is pending sanction sends you an expensive watch. What do you do?", "options": ["Accept it — the sanction is not yours to approve", "Accept and declare it after sanction", "Politely decline and report it as per the gifts & conflict-of-interest policy", "Pass it to your mentor"], "answer": 2, "explanation": "Gifts during a pending decision create a conflict of interest; decline and report."}, {"module": "GOV", "stem": "A customer deposits ₹9.5 lakh in cash on four consecutive days. This pattern is best described as:", "options": ["Normal treasury management", "Structuring — a money-laundering red flag", "Sweep-in", "Cash pooling"], "answer": 1, "explanation": "Splitting cash to stay under reporting thresholds is structuring and must be escalated."}, {"module": "GOV", "stem": "Under the DPDP Act 2023 and bank infosec policy, which action is acceptable?", "options": ["Forwarding a client's balance sheet to your personal Gmail to work from home", "Sharing a CIF list with a vendor on WhatsApp", "Accessing client data only on bank systems for the purpose it was collected", "Keeping printed KYC copies at home"], "answer": 2, "explanation": "Purpose limitation and secure processing on approved systems only."}, {"module": "PPL", "stem": "The core role of a corporate Relationship Manager is best described as:", "options": ["Processing loan documentation", "Single point of accountability for the client, orchestrating product specialists, credit and operations", "Approving credit limits", "Setting treasury rates"], "answer": 1, "explanation": "The RM owns the relationship and coordinates internal specialists."}, {"module": function pickCoach(kind,dept,region,same){const pool=kind==='boss'?BOSSES:kind==='mentor'?MENTORS:HRS;
  return pool.filter(c=>load(c)<c.max&&(dept==null||(same?c.dept===dept:c.dept!==dept))).sort((a,b)=>((b.region===region)-(a.region===region))||load(a)-load(b)||a.name.localeCompare(b.name))[0]}
function createJoinee(p){
  const name=(p.name||'').trim(),email=(p.email||'').trim().toLowerCase(),exp=+p.exp,dept=(p.dept||'').toUpperCase(),region=p.region;
  if(!name)throw Error('Name is required');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))throw Error('A valid work email is required');
  if(joinees.some(j=>j.email===email)||Object.values(PEOPLE).some(x=>x.email===email))throw Error(`Email ${email} is already registered`);
  if(!DEPTS[dept])throw Error(`Unknown department ${p.dept||'(blank)'}`);
  if(!REGIONS.includes(region))throw Error(`Unknown region ${region||'(blank)'}`);
  if(!(exp>=37&&exp<=59))throw Error(`New joinees must have more than 3 and less than 5 years of experience (got ${isNaN(exp)?'none':yrs(exp)})`);
  if(joinees.length>=CAPACITY)throw Error(`Cohort is full (${joinees.length} of ${CAPACITY} seats used)`);
  const boss=p.boss?PEOPLE[p.boss]:pickCoach('boss',dept,region,true), mentor=p.mentor?PEOPLE[p.mentor]:pickCoach('mentor',dept,region,false);
  const hr=HRS.find(h=>h.region===region&&load(h)<h.max)||pickCoach('hr',null,region,false);
  if(!boss)throw Error(`No Reporting Boss in ${DSHORT[dept]} has a free place`);
  if(boss.dept!==dept)throw Error(`Reporting Boss must be from ${DSHORT[dept]}, not ${DSHORT[boss.dept]}`);
  if(!mentor)throw Error(`No mentor outside ${DSHORT[dept]} has a free place`);
  if(mentor.dept===dept)throw Error(`Mentor must come from a different department than ${DSHORT[dept]}`);
  const j={id:nextCode,code:'TRN'+String(nextCode++).padStart(4,'0'),name,email,phone:p.phone||'',dept,region,exp,prevEmp:p.prevEmp||'',prevRole:p.prevRole||'',start:p.start||'2026-10-05',
    boss:boss.id,mentor:mentor.id,hr:hr.id,status:'due',g1:null,risk:Math.round(Math.random()*20),added:p.added||false};
  joinees.push(j);return j}

// minimal markdown → HTML for the training notes
function md(src){
  const lines=src.replace(/\r/g,'').split('\n');let h='',i=0;
  const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|\s)\*([^*]+)\*/g,'$1<i>$2</i>');
  while(i<lines.length){const l=lines[i];
    if(/^```/.test(l)){let b='';i++;while(i<lines.length&&!/^```/.test(lines[i]))b+=lines[i++]+'\n';i++;h+=`<pre><code>${esc(b)}</code></pre>`;continue}
    let m;if(m=l.match(/^(#{1,3})\s+(.*)/)){h+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;i++;continue}
    if(/^\|/.test(l)){const rows=[];while(i<lines.length&&/^\|/.test(lines[i]))rows.push(lines[i++]);const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());const body=rows.filter(r=>!/^\|[\s|:-]+\|$/.test(r));h+=`<div class="tscroll"><table><thead><tr>${cells(body[0]).map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${body.slice(1).map(r=>`<tr>${cells(r).map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;continue}
    if(/^\s*[-*]\s+/.test(l)){let b='';while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i]))b+=`<li>${inl(lines[i++].replace(/^\s*[-*]\s+/,''))}</li>`;h+=`<ul>${b}</ul>`;continue}
    if(/^\s*\d+\.\s+/.test(l)){let b='';while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i]))b+=`<li>${inl(lines[i++].replace(/^\s*\d+\.\s+/,''))}</li>`;h+=`<ol>${b}</ol>`;continue}
    if(!l.trim()){i++;continue}
    let p=l;i++;while(i<lines.length&&lines[i].trim()&&!/^(#|\||```|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i]))p+=' '+lines[i++];h+=`<p>${inl(p)}</p>`}
  return h}

function teamPanel(r){const team=teamOf(r);const st=[['Gate 1 cleared',t=>['phase2','coaching2','signoff','certified'].includes(ST_OF(t))||(t===ME&&ME.phase>1),'var(--good)'],['Test due / learning',t=>['due','learning','testing'].includes(ST_OF(t)),'var(--accent)'],['In coaching',t=>ST_OF(t).startsWith('coaching')||ST_OF(t)==='review','var(--warn)'],['Repeating',t=>ST_OF(t)==='remediation','var(--crit)'],['Inactive',t=>ST_OF(t)==='inactive','var(--crit)']];
  return `<div class="hbars">${st.map(([l,f,c])=>{const v=team.filter(f).length;return `<div class="hbar"><span>${l}</span><div class="track"><i style="width:${team.length?v/team.length*100:0}%;background:${c}"></i></div><span class="num" style="text-align:right">${v}</span></div>`}).join('')}</div>`}
function teamTable(r,n=50){const team=teamOf(r).slice().sort((a,b)=>(b===ME)-(a===ME)||b.risk-a.risk).slice(0,n);
  return `<div class="tscroll"><table><thead><tr><th>Trainee</th><th>Joins</th><th>Experience</th>${r!=='boss'?'<th>Reporting Boss</th>':''}${r!=='mentor'?'<th>Mentor</th>':''}<th>Status</th><th>Risk</th></tr></thead><tbody>${team.map(t=>`<tr><td>${esc(t.name)}<br><span class="mono muted">${t.code}</span></td><td>${DSHORT[t.dept]}</td><td class="num">${yrs(t.exp)}</td>${r!=='boss'?`<td>${esc(coachOf(t,'boss').name)}</td>`:''}${r!=='mentor'?`<td>${esc(coachOf(t,'mentor').name)}<br><span class="small muted">${DSHORT[coachOf(t,'mentor').dept]}</span></td>`:''}<td>${pill(ST_OF(t))}</td><td>${riskPill(t.risk)}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No joinees assigned yet.</td></tr>'}</tbody></table></div>`}
function coachHome(r,title,sub){const c=counts(r),me=VIEWER[r],team=teamOf(r);return `<div class="head"><div><span class="eyebrow">${ROLE_NAMES[r]} · ${esc(me.name)}</span><h1>${title}</h1><p class="sub">${sub}</p></div></div>
  <div class="grid g4"><div class="panel stat"><span class="eyebrow">Joinees assigned</span><span class="v">${team.length}</span><span class="d">limit ${me.max}</span></div>
   <div class="panel stat"><span class="eyebrow">Waiting for you</span><span class="v">${c.queue}</span><span class="d">coaching decisions${r==='mentor'?' and result checks':''}</span></div>
   <div class="panel stat"><span class="eyebrow">Sign-offs</span><span class="v">${c.signoff}</span><span class="d">Day 30</span></div>
   <div class="panel stat"><span class="eyebrow">High risk</span><span class="v">${team.filter(t=>t.risk>=60).length}</span><span class="d">early attrition signal</span></div></div>
  <div class="grid g-main"><div class="panel"><h2>${r==='mentor'?'Joinees you mentor':'Your team'}</h2>${teamTable(r)}</div><div class="panel"><h2>Where they are</h2>${teamPanel(r)}${r==='mentor'?`<div class="callout">You mentor joinees from departments other than your own (${DSHORT[me.dept]}). You give a coaching day at Gate 1 and 2, check held results, rate shadow logs on Days 22–29, and hold the Day-30 viva.</div>`:r==='boss'?`<div class="callout">Every joinee here joins your department, ${DSHORT[me.dept]}, after Day 30. You give a coaching day at Gate 1 and 2 and sign off on Day 30.</div>`:''}</div></div>`}
V.mentor.home=()=>coachHome('mentor','My trainees','Joinees from other departments you mentor through the 30 days, most at-risk first.');
V.boss.home=()=>coachHome('boss','My team','New RMs joining your department after Day 30, and where each stands in the programme.');

function coachingCard(id,c,r){const t=byId(+id);const g=GATES[c.gate];
  return `<div class="panel tight inner"><div class="row between"><div><b>${esc(t.name)}</b> <span class="mono muted">${t.code}</span></div><span class="pill p-warn">${g.title.replace(/ Assessment/,'')} · ${c.score}%</span></div>
   ${modBars(c.mods)}
   <span class="small muted">Coaches: ${c.need.map(x=>`${ROLE_NAMES[x]} ${c.dec[x]?(c.dec[x].d==='pass'?'✓ pass':'↺ repeat'):x===r?'(you)':'pending'}`).join(' · ')}. Any single "repeat" assigns the ticked modules.</span>
   ${c.flags&&Object.keys(c.flags).length?`<span class="small">Test activity recorded: ${Object.entries(c.flags).map(([k,v])=>k.replace(/_/g,' ')+' '+v).join(', ')}</span>`:''}
   <label class="f">Notes from your coaching day (min. 30 characters, kept in the audit trail)<textarea id="n_${id}"></textarea></label>
   <div class="row small">Repeat: ${Object.keys(c.mods).map(m=>`<label class="row" style="gap:4px"><input type="checkbox" id="m_${id}_${m}" ${c.mods[m]<70?'checked':''}> ${m}</label>`).join('')}</div>
   <div class="row"><button class="btn btn-primary" data-dec="pass" data-t="${id}">Pass to next phase</button><button class="btn" data-dec="repeat" data-t="${id}">Repeat ticked modules</button></div></div>`}
function verifyCard(){const r=ME.review;if(!r)return '';const lab={focus_lost:'Left the test screen',copy_paste:'Copy or paste',fullscreen_exit:'Exited full screen',assistant_during_test:'Tried the assistant',implausibly_fast_correct:'Calculations right in under 8 s'};
  return `<div class="panel tight inner hold"><div class="row between"><div><b>${esc(ME.name)}</b> <span class="mono muted">${ME.code}</span></div><span class="pill p-warn">Result on hold · ${r.score}%</span></div>
   <p class="small">Passed the ${GATES[r.gate].title}, but the attempt showed unusual activity (integrity ${r.integ.score}/100). Signals are not proof. Hold a 20-minute conversation within 2 working days.</p>
   <div class="row">${Object.entries(r.integ.flags).map(([k,v])=>`<span class="pill p-warn">${lab[k]||k} · ${v}</span>`).join('')}</div>
   <span class="eyebrow">Ask them to explain these answers in their own words</span>
   <ol class="olist">${r.ans.slice(0,4).map(a=>`<li class="small">${esc(a.q.stem)} <span class="muted">Chose: ${esc(a.choice==null?'no answer':a.q.options[a.choice])} · ${Math.round(a.ms/1000)} s</span></li>`).join('')}</ol>
   <div class="row"><label class="f">Viva score<select id="vivaScore"><option value="5">5 · Explains fluently</option><option value="4">4 · Explains well</option><option value="3" selected>3 · Adequate</option><option value="2">2 · Struggles</option><option value="1">1 · Cannot explain</option></select></label></div>
   <label class="f">What you asked and how they answered (min. 30 characters)<textarea id="vivaNotes"></textarea></label>
   <div class="row"><button class="btn btn-primary" id="confirmRes">Confirm result</button><button class="btn" id="voidRes">Void · supervised re-sit</button></div></div>`}
function hrReviewCard(){return `<div class="panel tight inner hold"><div class="row between"><div><b>${esc(ME.name)}</b> <span class="mono muted">${ME.code}</span></div><span class="pill p-crit">Two attempts used</span></div>
  <p class="small">Did not clear the ${curGate().title} after two attempts and coaching. Meet the trainee and the reporting boss, then decide.</p>
  <label class="f">Decision notes (min. 30 characters)<textarea id="hrNotes"></textarea></label>
  <div class="row"><button class="btn btn-primary" id="hrExtend">Extend by one week, one more attempt</button><button class="btn" id="hrExit">Move to a different role / exit process</button></div></div>`}
function queueView(r,title,sub){const mine=Object.entries(coaching).filter(([id,c])=>c.need.includes(r)&&!c.dec[r]&&inMyTeam(byId(+id),r));
  const extra=(r==='mentor'&&ME.status==='review'?verifyCard():'')+(r==='hr'&&ME.status==='hr_review'?hrReviewCard():'');
  return `<div class="head"><div><span class="eyebrow">${ROLE_NAMES[r]}</span><h1>${title}</h1><p class="sub">${sub}</p></div><span class="pill ${mine.length||extra?'p-warn':'p-good'}">${mine.length+(extra?1:0)} waiting</span></div>
  <div class="panel">${extra}${mine.map(([id,c])=>coachingCard(id,c,r)).join('')||(!extra?'<p class="muted">Nothing waiting. New requests arrive here and by email when a trainee misses a gate.</p>':'')}</div>`}
V.mentor.queue=()=>queueView('mentor','Coaching & checks','One coaching day for every trainee who misses Gate 1 or Gate 2, and a short conversation when a pass is held for a result check.');
V.boss.queue=()=>queueView('boss','Coaching','One coaching day for every trainee in your team who misses Gate 1 or Gate 2.');
V.hr.queue=()=>queueView('hr','Coaching & reviews','One coaching day for every trainee who misses Gate 1 or the Day 30 assessment, and a decision when two attempts are used.');

V.mentor.shadowrev=()=>{const all=[...ME.shadow.map(s=>({...s,tid:ME.id,own:s})),...otherShadow.map(s=>({...s,own:s}))].filter(s=>s.state==='pending');

  <div class="panel">${all.length?all.map((s,ix)=>{const t=byId(s.tid);return `<div class="panel tight inner"><div class="row between"><div><b>${esc(t.name)}</b> <span class="mono muted">${t.code} · ${esc(s.ref)}</span></div><span class="pill p-info">Day ${s.day} · ${esc(s.type)}</span></div>
    <span class="small"><b>Observed:</b> ${esc(s.obs)}</span><span class="small"><b>Reflection:</b> ${esc(s.refl)}</span>

  <div class="panel">${ready?`<div class="panel tight inner"><div class="row between"><div><b>${esc(ME.name)}</b> <span class="mono muted">${ME.code}</span></div><span class="pill p-good">Final ${ME.scores.F}%</span></div>
   <div class="grid g3"><div class="out"><span class="eyebrow">Gate 1</span><span class="v">${ME.scores.G1??'Coach pass'}${ME.scores.G1!=null?'%':''}</span></div><div class="out"><span class="eyebrow">Gate 2</span><span class="v">${ME.scores.G2??'Coach pass'}${ME.scores.G2!=null?'%':''}</span></div><div class="out"><span class="eyebrow">Shadow rating</span><span class="v">${(ME.shadow.filter(s=>s.avg).reduce((a,s)=>a+s.avg,0)/Math.max(1,ME.shadow.filter(s=>s.avg).length)).toFixed(1)}/5</span></div></div>
   <div class="row">${['mentor','boss','hr'].map(x=>`<span class="pill ${ME.sign[x]?'p-good':'p-mute'}">${ROLE_NAMES[x]} ${ME.sign[x]?'signed':'pending'}</span>`).join('')}</div>
   ${vivaBlock}
   ${ME.sign[r]?'<span class="pill p-good">You have signed</span>':`<label class="f">Comments<textarea id="signNotes" style="min-height:60px"></textarea></label><div class="row"><button class="btn btn-primary" id="signYes" ${r==='mentor'&&!(ME.viva>=3)?'disabled':''}>Approve and sign</button><button class="btn" id="signNo">Not ready · refer to HR</button></div>`}</div>`
   :`<p class="muted">${ME.status==='certified'?`${esc(ME.name)} was certified. No sign-offs waiting.`:'No trainees are waiting for sign-off. Trainees appear here after passing the Day 30 assessment.'}</p>`}</div>`}

function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}

let quiz=null, clockH=null;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function variant(q){const s=q.stem, cr=v=>Math.abs(v)<1?`₹${+(v*100).toFixed(2)} lakh`:`₹${+v.toFixed(2)} Cr`;
  const mk=(stem,ok,wrong)=>{const o=[ok,...wrong].filter((v,i,a)=>a.indexOf(v)===i);while(o.length<4)o.push(cr(Math.random()*50+1));return {...q,stem,options:o.slice(0,4),answer:0,calc:true}};
  if(s.startsWith('Stock ₹')){const st=pick([80,90,110,120,140]),r=pick([40,50,60,70]),c=pick([20,30,35,45]),m=pick([.2,.25,.3]);return mk(`Stock ₹${st} Cr, eligible receivables ₹${r} Cr, trade creditors ₹${c} Cr, margin ${m*100}%. Drawing power is:`,cr((st+r-c)*(1-m)),[cr(st+r-c),cr((st+r)*(1-m)),cr((st+r+c)*(1-m))])}
  if(/^Loan ₹\d+ Cr/.test(s)){const a=pick([10,15,20,25,40]),y=pick([9.25,9.5,9.75,10]),f=pick([6.75,7,7.25]);return mk(`Loan ₹${a} Cr at ${y.toFixed(2)}% with an FTP of ${f.toFixed(2)}%. Annual net interest income is:`,cr(a*(y-f)/100),[cr(a*y/100),cr(a*f/100),cr(a*(y-f)/10)])}
  if(/^PD \d/.test(s)){const pd=pick([.5,1,1.5,2,3]),l=pick([35,40,45,50]),e=pick([20,30,40,50,60]);return mk(`PD ${pd}%, LGD ${l}%, EAD ₹${e} Cr. Expected loss is:`,cr(pd/100*l/100*e),[cr(pd/100*e),cr(l/100*e),cr(pd/100*l/100*e*10)])}
  return q}
function shuffleQ(q){const idx=q.options.map((_,i)=>i).sort(()=>Math.random()-.5);return {...q,options:idx.map(i=>q.options[i]),answer:idx.indexOf(q.answer)}}
function assessHTML(){
