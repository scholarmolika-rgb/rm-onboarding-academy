<title>RM Onboarding Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: fixed left rail of roles on desktop (top tabs on phone); ledger-like panels with hairline rules; one accent (ink blue). */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sunken:#EEF1F4; --line:#DDE2E8; --line-strong:#C6CDD6;
  --ink:#16223A; --text:#27313F; --muted:#5E6878; --faint:#8A93A1;
  --accent:#1F4E79; --accent-soft:#E6EDF5; --on-accent:#FFFFFF;
  --good:#2E7457; --good-soft:#E4F1EA; --warn:#9A6412; --warn-soft:#F7EEDD; --crit:#A8321F; --crit-soft:#F7E4E0;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-sm:4px; --r-md:6px; --r-lg:10px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10151D; --surface:#171E28; --sunken:#1D2531; --line:#2A3441; --line-strong:#3A4555;
  --ink:#E8EDF3; --text:#D3DAE3; --muted:#9AA5B4; --faint:#6F7A89;
  --accent:#7FA8D6; --accent-soft:#1F2F44; --on-accent:#0E1520;
  --good:#6DBB95; --good-soft:#193127; --warn:#D9A554; --warn-soft:#33281A; --crit:#E0806E; --crit-soft:#3A201B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10151D; --surface:#171E28; --sunken:#1D2531; --line:#2A3441; --line-strong:#3A4555;
  --ink:#E8EDF3; --text:#D3DAE3; --muted:#9AA5B4; --faint:#6F7A89;
  --accent:#7FA8D6; --accent-soft:#1F2F44; --on-accent:#0E1520;
  --good:#6DBB95; --good-soft:#193127; --warn:#D9A554; --warn-soft:#33281A; --crit:#E0806E; --crit-soft:#3A201B; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);color:var(--ink);text-wrap:balance;margin:0;font-weight:600}
h1{font-size:1.6rem;line-height:1.2} h2{font-size:1.2rem} h3{font-size:1rem;font-family:var(--f-body);font-weight:600}
p{margin:0} .muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.82rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding-block:var(--s5);padding-inline:var(--s4);display:flex;flex-direction:column;gap:var(--s5);position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;gap:var(--s3);align-items:center}
.mark{width:34px;height:34px;border-radius:var(--r-md);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:600}
.brand b{display:block;color:var(--ink);font-size:.95rem;line-height:1.2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:var(--r-md);color:var(--text)}
.nav button:hover{background:var(--sunken)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .who{font-size:.72rem;color:var(--faint)}
.rail-foot{margin-top:auto;font-size:.75rem;color:var(--faint)}

main{padding-block:var(--s6);padding-inline:clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:var(--s5);min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s4);flex-wrap:wrap}
.head .sub{max-width:62ch;margin-top:6px;color:var(--muted)}
.demo-tag{font-size:.72rem;border:1px solid var(--line-strong);border-radius:99px;padding:2px 10px;color:var(--muted)}

.grid{display:grid;gap:var(--s4)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.stat{padding:var(--s4) var(--s5);gap:4px}
.stat .v{font-size:1.7rem;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .d{font-size:.8rem;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)} .p-info{background:var(--accent-soft);color:var(--accent)} .p-mute{background:var(--sunken);color:var(--muted)}

.btn{cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-md);padding:7px 14px;font-weight:500}
.btn:hover{background:var(--sunken)}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}

table{border-collapse:collapse;width:100%;font-size:.85rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.tscroll{overflow-x:auto}

/* journey */
.journey{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:3px}
.day{aspect-ratio:1/1.35;border-radius:3px;background:var(--sunken);display:grid;place-items:end center;font-size:.62rem;color:var(--faint);padding-bottom:2px;position:relative;max-width:100%}
.day.done{background:var(--accent);color:var(--on-accent);opacity:.85}
.day.today{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.day.gate{background:var(--warn-soft);color:var(--warn);font-weight:600}
.day.gate.done{background:var(--good);color:var(--on-accent)}
.phases{display:grid;grid-template-columns:15fr 6fr 9fr;gap:3px;font-size:.75rem;color:var(--muted)}
.phases div{border-top:2px solid var(--line-strong);padding-top:4px}

.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.check{width:18px;height:18px;border:1.5px solid var(--line-strong);border-radius:4px;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kind{font-size:.7rem;font-family:var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}

.bar{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 56px;gap:var(--s3);align-items:center;font-size:.85rem}
.hbar .track{height:14px;background:var(--sunken);border-radius:3px;overflow:hidden}
.hbar .track i{display:block;height:100%}

.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.step{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.step .t{font-weight:600;color:var(--ink);font-size:.9rem}
.step.gate{border-color:var(--warn);background:var(--warn-soft)}
.step small{color:var(--muted)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
label.f input,label.f select,textarea{border:1px solid var(--line-strong);border-radius:var(--r-md);padding:7px 10px;background:var(--surface);color:var(--text);font-size:.9rem}
textarea{width:100%;min-height:84px;resize:vertical}
.roi-out{display:flex;flex-direction:column;gap:2px;padding:var(--s4);border-radius:var(--r-md);background:var(--sunken)}
.roi-out .v{font-size:1.4rem;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

.quiz-q{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer}
.opt:hover{background:var(--sunken)}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.wrong{border-color:var(--crit);background:var(--crit-soft)}

.dflow{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.dflow li{padding-left:4px}
.dflow li::marker{color:var(--accent);font-weight:600}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:var(--s3) var(--s4);border-radius:0 var(--r-md) var(--r-md) 0;font-size:.88rem}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.crit{border-color:var(--crit);background:var(--crit-soft)}
.mail{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:2px;font-size:.84rem}
.mail .to{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);overflow-wrap:anywhere}

/* chat */
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;border-radius:99px;padding:11px 18px;box-shadow:0 6px 20px rgba(16,24,40,.18)}
.drawer{position:fixed;right:20px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 32px));height:min(560px,calc(100vh - 120px));background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:0 12px 40px rgba(16,24,40,.22);display:flex;flex-direction:column;z-index:21}
.drawer header{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.msgs{flex:1;overflow-y:auto;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.msg{max-width:88%;padding:9px 12px;border-radius:var(--r-lg);font-size:.86rem;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--sunken);border-bottom-left-radius:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 var(--s4) var(--s2)}
.chip{cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:.75rem}
.chat-in{display:flex;gap:var(--s2);padding:var(--s3);border-top:1px solid var(--line)}
.chat-in input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:var(--r-md);padding:8px 10px;background:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-md);font-size:.85rem;z-index:30;max-width:calc(100vw - 32px)}

@media (max-width:980px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g-main,.g3{grid-template-columns:minmax(0,1fr)} .flow{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:var(--s3);gap:var(--s3)}
  .nav{flex-direction:row;overflow-x:auto} .nav button{white-space:nowrap} .nav .who,.rail-foot{display:none}
  .g2{grid-template-columns:minmax(0,1fr)} .hbar{grid-template-columns:100px minmax(0,1fr) 48px}
  .journey{grid-template-columns:repeat(15,minmax(0,1fr))} .phases{display:none}
}
@media (max-width:440px){ .g4{grid-template-columns:minmax(0,1fr)} .flow{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:no-preference){ .bar i,.hbar .track i{transition:width .5s ease} }
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><div class="mark">RM</div><div><b>Onboarding Academy</b><span class="eyebrow">Corporate Banking</span></div></div>
    <nav class="nav" id="nav" aria-label="Views">
      <button data-v="leadership">Business case <span class="who">Leadership</span></button>
      <button data-v="trainee">My journey <span class="who">Trainee</span></button>
      <button data-v="mentor">Coaching <span class="who">Mentor</span></button>
      <button data-v="manager">My team <span class="who">Reporting mgr</span></button>
      <button data-v="hr">Programme ops <span class="who">HR</span></button>
      <button data-v="design">How it works <span class="who">Rules & flow</span></button>
    </nav>
    <div class="rail-foot">Cohort 2026-10 · 1,000 trainees · 20 mentors · 20 reporting managers · 5 HR partners<br><br>Prototype with demo data. Production runs on Supabase.</div>
  </aside>
  <main id="main"></main>
</div>
<button class="btn btn-primary fab" id="fab">Ask the Academy</button>
<div class="drawer" id="drawer" hidden>
  <header><div><h3>Academy Assistant</h3><span class="muted" style="font-size:.75rem">Answers from training content · never share customer data</span></div><button class="btn" id="closeChat" aria-label="Close assistant">Close</button></header>
  <div class="msgs" id="msgs"></div>
  <div class="chips" id="chips"></div>
  <form class="chat-in" id="chatForm"><input id="chatInput" placeholder="Ask about KYC, drawing power, RAROC…" autocomplete="off"><button class="btn btn-primary" id="chatSend">Send</button></form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// ---------------- Demo data (deterministic) ----------------
let seed=42; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const FN=['Aarav','Diya','Kabir','Ishita','Rohan','Sneha','Vikram','Ananya','Arjun','Priya','Nikhil','Tanvi','Rahul','Kavya','Siddharth','Pooja','Aditya','Neha','Varun','Riya'];
const LN=['Sharma','Reddy','Iyer','Mehta','Nair','Gupta','Das','Kulkarni','Singh','Banerjee','Patel','Menon','Joshi','Rao','Chawla'];
const TODAY_DAY=15; // cohort sits on Day 15 (Gate 1) in the demo
const trainees=[];
for(let i=1;i<=1000;i++){
  const mentor=1+Math.floor((i-1)/50); const r=rnd();
  let status='active', g1=null, risk=Math.round(rnd()*35);
  const done=Math.min(14,10+Math.floor(rnd()*5));
  if(r<0.62){g1=80+Math.round(rnd()*18);status='passed_gate1'}
  else if(r<0.80){g1=62+Math.round(rnd()*17);status='coaching';risk+=35}
  else if(r<0.86){g1=65+Math.round(rnd()*14);status='remediation';risk+=40}
  else if(r<0.97){status='due';}
  else {status='inactive';risk+=45}
  trainees.push({id:i,code:'TRN'+String(i).padStart(4,'0'),name:FN[i%20]+' '+LN[(i*7)%15],mentor,cluster:'Cluster '+mentor,done,g1,status,risk:Math.min(95,risk)});
}
const ME=trainees[1]; ME.status='due'; ME.g1=null; ME.done=14; ME.risk=12; // Diya Kulkarni, TRN0002, mentor 1
const outbox=[
 {t:'08:02',tpl:'Coaching required',to:['mentor4@bank.example','manager4@bank.example','hr4@bank.example'],sub:'Action required: 1-day coaching for Rohan Gupta (TRN0154)'},
 {t:'07:40',tpl:'Coaching overdue',to:['hr2@bank.example','manager7@bank.example'],sub:'Overdue coaching for Tanvi Menon (TRN0331)'},
];
const coaching={}; // trainee id -> {mentor:null|{d,notes,mods}, manager:..., hr:...}
// pre-existing coaching items for Mentor 1's queue
trainees.filter(t=>t.mentor===1&&t.status==='coaching').slice(0,3).forEach(t=>coaching[t.id]={gate:'GATE_1',score:t.g1,mentor:null,manager:null,hr:null,mods:{GOV:55+Math.round(rnd()*30),PPL:70+Math.round(rnd()*25),PRD:55+Math.round(rnd()*35),PRC:50+Math.round(rnd()*35)}});

const CURRICULUM=[
 {d:1,m:'GOV',items:[['read','Bank structure & how the corporate bank earns'],['read','Code of conduct, conflicts & gifts']]},
 {d:2,m:'GOV',items:[['read','Regulatory map: RBI, PMLA, FEMA, DPDP'],['worksheet','KYC / beneficial ownership checklist']]},
 {d:3,m:'GOV',items:[['case','AML red flags — 5 vignettes'],['read','Data privacy & infosec']]},
 {d:4,m:'PPL',items:[['read','The RM role and KRAs'],['worksheet','Internal stakeholder map']]},
 {d:5,m:'PPL',items:[['simulation','Consultative discovery role-play'],['read','POSH & respectful workplace']]},
 {d:6,m:'PRD',items:[['read','Working capital: CC, OD, WCDL'],['worksheet','Drawing power calculator']]},
 {d:7,m:'PRD',items:[['read','Term loans & DSCR']]},{d:8,m:'PRD',items:[['read','Trade finance: LC, BG, PCFC']]},
 {d:9,m:'PRD',items:[['read','Transaction banking: CMS, payroll, SCF']]},
 {d:10,m:'PRD',items:[['read','Treasury & FX hedging'],['case','Apex Auto Components facility design']]},
 {d:11,m:'PRC',items:[['read','Client onboarding journey']]},{d:12,m:'PRC',items:[['worksheet','Write a Credit Appraisal Memo']]},
 {d:13,m:'PRC',items:[['read','Sanction, documentation, CERSAI']]},
 {d:14,m:'PRC',items:[['read','EWS, SMA and NPA norms'],['read','Complaints & CRM hygiene']]},
 {d:15,m:'GATE',items:[['assessment','Day 15 Foundation Assessment · pass 80%']]},
];
const MODULES={GOV:'Governance, Regulation & Conduct',PPL:'People, Culture & the RM Role',PRD:'Corporate Banking Products',PRC:'Credit & Operating Processes'};

const BANK=[
 {m:'GOV',q:'To which authority does a bank file CTRs and STRs?',o:['Reserve Bank of India','FIU-IND','SEBI','Enforcement Directorate'],a:1},
 {m:'GOV',q:'For a company, a beneficial owner holds an ownership interest of:',o:['More than 25%','More than 10%','More than 51%','Any shareholding'],a:1},
 {m:'GOV',q:'A client with a loan pending sanction sends you an expensive watch. You:',o:['Accept it','Accept and declare after sanction','Decline and report under the gifts policy','Pass it to your mentor'],a:2},
 {m:'PPL',q:'The best opening in a first meeting with a mid-corporate prospect is:',o:['Present the brochure','Quote the lowest rate','Open questions on business cycle and cash conversion','Ask for three years of financials'],a:2},
 {m:'PRD',q:'Stock ₹100 Cr, receivables ₹60 Cr, creditors ₹40 Cr, margin 25%. Drawing power?',o:['₹120 Cr','₹90 Cr','₹75 Cr','₹160 Cr'],a:1},
 {m:'PRD',q:'An importer with USD payables in 90 days fears rupee depreciation. Simplest hedge?',o:['Sell USD forward','Buy USD forward','Open an FD','Take a term loan'],a:1},
 {m:'PRC',q:'A term-loan instalment is overdue by 45 days. The account is:',o:['SMA-0','SMA-1','SMA-2','NPA'],a:1},
 {m:'PRC',q:'Security interest must be registered with CERSAI within:',o:['7 days','30 days','60 days','90 days'],a:1},
 {m:'PRC',q:'Periodic KYC for high-risk customers is due at least every:',o:['1 year','2 years','8 years','10 years'],a:1},
 {m:'PRC',q:'Maker-checker means:',o:['The RM enters and approves','A second person verifies and authorises','Customers check statements','Auditors make entries'],a:1},
];

// ---------------- helpers ----------------
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=v=>v<1?'₹'+Math.round(v*100)+' lakh':'₹'+(v>=100?Math.round(v).toLocaleString('en-IN'):v.toFixed(1))+' Cr';
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,3600)}
function pill(status){const map={passed_gate1:['Gate 1 cleared','p-good'],coaching:['In coaching','p-warn'],remediation:['Repeating modules','p-crit'],due:['Test due today','p-info'],inactive:['Inactive 3+ days','p-crit'],active:['On track','p-good'],phase2:['Phase 2 unlocked','p-good']};const [l,c]=map[status]||[status,'p-mute'];return `<span class="pill ${c}">${l}</span>`}

function calcROI(){
  const g=id=>parseFloat($('#r_'+id)?.value)||0;
  const J=g('joiners'), exitsBase=J*g('base')/100, exitsNew=J*g('target')/100, avoided=Math.max(0,exitsBase-exitsNew);
  const perExit=g('ctc')/100*g('repl')/100 + g('rev')*g('loss')/100; // ₹ Cr
  const benefit=avoided*perExit, cost=g('build')+g('coach'), net=benefit-cost;
  const hireCut=exitsBase?avoided/exitsBase*100:0;
  $('#roiOut').innerHTML=[
    ['Exits avoided',Math.round(avoided).toLocaleString('en-IN'),`of ${Math.round(exitsBase)} today`],
    ['Cost per exit',inr(perExit),'replacement + lost revenue'],
    ['Net annual benefit',inr(net),`${cost?(benefit/cost).toFixed(1):'–'}× programme cost`],
    ['Replacement hiring cut',hireCut.toFixed(0)+'%',hireCut>=10?'meets 10% goal':'below 10% goal']
  ].map(([l,v,d])=>`<div class="roi-out"><span class="eyebrow">${l}</span><span class="v">${v}</span><span class="muted" style="font-size:.78rem">${d}</span></div>`).join('');
}

function decide(id,role,d){
  const c=coaching[id], notes=($('#n_'+id)?.value||'').trim();
  if(notes.length<30){toast('Add at least 30 characters of session notes before recording a decision.');$('#n_'+id)?.focus();return}
  const mods=Object.keys(MODULES).filter(m=>$(`#m_${id}_${m}`)?.checked);
  c[role]={d,notes,mods:d==='repeat'?mods:[]};
  const pending=['mentor','manager','hr'].filter(r=>!c[r]);
  const t=trainees[id-1];
  if(pending.length){toast(`Recorded. Waiting for ${pending.map(r=>r==='hr'?'HR':r).join(' and ')}.`);render();return}
  const rep=[...new Set(['mentor','manager','hr'].flatMap(r=>c[r].mods))];
  if(['mentor','manager','hr'].some(r=>c[r].d==='repeat')){
    c.repeat=rep.length?rep:Object.keys(c.mods).filter(m=>c.mods[m]<70); t.status='remediation';
    queueEmail('Refresher assigned',[`trainee${id}@bank.example`],'Refresher modules assigned');
    toast(`All three coaches decided. ${t.name.split(' ')[0]} repeats ${c.repeat.join(', ')}.`);
  } else {
    t.status='phase2'; delete coaching[id];
    queueEmail('Next phase unlocked',[`trainee${id}@bank.example`],'Next phase unlocked on coaches\' recommendation');
    toast(`All three coaches passed ${t.name.split(' ')[0]}. Phase 2 unlocked.`);
  }
  render();
}

        <li>Randomised question sets, server-side grading and module-level scores for targeted remediation.</li>
        <li>Coaching SLA of three working days with automatic escalation when missed.</li>
        <li>Mandatory learning must be complete before a test opens.</li>
        <li>No customer PII in shadow logs; the assistant masks PAN, Aadhaar and account numbers.</li>
        <li>Maker-checker system access only after Gate 2.</li>
        <li>Append-only audit log for every score, decision and sign-off.</li>
        <li>Attrition-risk score and pulse surveys, visible to HR only.</li>
        <li>Staggered monthly waves so mentors are not coaching 50 people at once.</li>
      </ul>
    </div>
  </div>`;

// ---------------- render & events ----------------
let view='leadership';
function render(){
  $('#main').innerHTML=views[view]();
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===view?'page':'false'));
  if(view==='leadership')calcROI();
  }
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;try{history.replaceState(null,'','#'+view)}catch(_){}render();window.scrollTo(0,0)});
document.getElementById('main').addEventListener('input',e=>{if(e.target.id?.startsWith('r_'))calcROI();if(e.target.dataset.q!==undefined){quizState.ans[e.target.dataset.q]=+e.target.dataset.o;const b=$('#submitQuiz');if(b)b.disabled=Object.keys(quizState.ans).length<BANK.length;const h=$('#assessPanel .panel-h .muted');if(h)h.textContent=Object.keys(quizState.ans).length+'/'+BANK.length+' answered'}});
document.getElementById('main').addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='startQuiz'){quizState={ans:{}};$('#assessPanel').innerHTML=assessHTML();return}
  if(t.id==='failFast'){submitAttempt(70,{GOV:55,PPL:85,PRD:75,PRC:65});return}
  if(t.id==='submitQuiz'){
    const by={};let ok=0;BANK.forEach((q,i)=>{by[q.m]=by[q.m]||[0,0];by[q.m][1]++;if(quizState.ans[i]===q.a){ok++;by[q.m][0]++}});
    const mods={};Object.keys(MODULES).forEach(m=>mods[m]=by[m]?Math.round(by[m][0]/by[m][1]*100):0);
    submitAttempt(Math.round(ok/BANK.length*100),mods);return}
  if(t.id==='finishRem'){ME.status='due';quizState=null;toast('Refresher complete. Attempt 2 of 2 is open.');render();return}
  if(t.dataset.dec){decide(+t.dataset.t,t.dataset.r,t.dataset.dec);return}
  const ck=t.closest('.check');if(ck){const k=ck.dataset.k;doneItems.has(k)?doneItems.delete(k):doneItems.add(k);render()}
});

// ---------------- Assistant ----------------
const KB=`Programme: 30 training days. Days 1-14 Foundation (Governance, People, Product, Process). Day 15 Gate 1 pass 80%; below 80% emails Mentor, Reporting Manager and HR, one coaching day each, then pass or repeat named modules. Days 16-20 Pricing & P&L. Day 21 Gate 2 pass 75%; below that Mentor + Manager coach. Days 22-29 shadowing with mentor. Day 30 final assessment 80% + sign-off by Mentor, Manager, HR. Two attempts per gate; second miss -> HR review.
Facts: CTR/STR filed with FIU-IND; STR within 7 working days. Company beneficial owner >10%. KYC refresh: high risk 2y, medium 8y, low 10y. SMA-0 1-30 days, SMA-1 31-60, SMA-2 61-90, NPA >90; CC out of order 90 days -> NPA. CERSAI within 30 days. RBI Integrated Ombudsman after 30 days unresolved.
Formulas: Drawing power = (eligible stock + eligible receivables - creditors) x (1 - margin). NII = (yield - FTP) x balance. Expected loss = PD x LGD x EAD. Capital = exposure x risk weight x capital ratio (11.5%). RAROC = (income - opex - EL - tax) / capital. EBLR resets at least every 3 months. DSCR = (PAT + depreciation + interest on TL) / (interest + principal).`;
const chat=[]; let samplerP=null;
function addMsg(r,t){chat.push({role:r,content:t});const d=document.createElement('div');d.className='msg '+(r==='user'?'u':'a');d.textContent=t;$('#msgs').appendChild(d);$('#msgs').scrollTop=1e9;return d}
function fallback(q){q=q.toLowerCase();
  if(q.includes('drawing'))return 'Drawing power = (eligible stock + eligible receivables − trade creditors) × (1 − margin).\nExample: (100 + 60 − 40) × 0.75 = ₹90 Cr. You can draw the lower of the limit and DP.\nSource: Day 6, Working capital.';
  if(q.includes('raroc')||q.includes('expected loss'))return 'Expected loss = PD × LGD × EAD. RAROC = (income − operating cost − expected loss − tax) ÷ allocated capital, where capital = exposure × risk weight × 11.5%.\nSource: Day 17, RAROC.';
  if(q.includes('fail')||q.includes('80'))return 'If you score below 80% on Day 15, your Mentor, Reporting Manager and HR partner are emailed and each holds a one-day coaching session. They then pass you or assign specific modules to repeat before your second attempt.';
  if(q.includes('kyc'))return 'Periodic KYC: high-risk customers every 2 years, medium every 8, low every 10. For a company, anyone owning more than 10% is a beneficial owner.\nSource: Day 2, Regulatory map.';
  return 'I can help with programme rules, KYC and AML, products, drawing power, pricing and RAROC. The live assistant is not available in this view, so these are stored answers.'}
async function ask(q){
  addMsg('user',q); const el=addMsg('assistant','Thinking…'); $('#chatSend').disabled=true;
  const redacted=q.replace(/\b[A-Z]{5}[0-9]{4}[A-Z]\b/g,'[PAN]').replace(/\b\d{4}\s?\d{4}\s?\d{4}\b/g,'[AADHAAR]');
  try{
    const sample=await (samplerP||(samplerP=window.claude?.use?window.claude.use('sample'):Promise.resolve(null)));
    if(!sample)throw {code:'unavailable'};
    const turns=chat.slice(0,-1).slice(-8).map(m=>({role:m.role,content:m.content}));
    turns[turns.length-1]={role:'user',content:`You are the RM Onboarding Academy assistant for a large Indian private-sector corporate bank. Answer the trainee briefly and professionally using ONLY this knowledge; show formula, working and answer for calculations; never give assessment answers; refuse to handle customer personal data; for policy exceptions point to mentor/manager/HR. End with "Source: Day N, topic" when possible.\nKNOWLEDGE:\n${KB}\nTRAINEE: ${ME.name}, Day ${TODAY_DAY}, status ${ME.status}${ME.g1?', Gate 1 score '+ME.g1+'%':''}.\nQUESTION: ${redacted}`};
    const r=await sample(turns,{modelTier:'quick',cache:false,onText:({text})=>{el.textContent=text}});
    el.textContent=r.text; chat[chat.length-1].content=r.text;
  }catch(e){const t=fallback(q);el.textContent=t;chat[chat.length-1].content=t}
  $('#chatSend').disabled=false;
}
const CHIPS=['What happens if I score below 80%?','Explain drawing power with an example','How is RAROC calculated?','When is KYC refresh due for high-risk clients?'];
$('#chips').innerHTML=CHIPS.map(c=>`<button class="chip" type="button">${c}</button>`).join('');
$('#chips').addEventListener('click',e=>{if(e.target.classList.contains('chip'))ask(e.target.textContent)});
$('#fab').onclick=()=>{const d=$('#drawer');d.hidden=!d.hidden;if(!d.hidden&&!chat.length)addMsg('assistant',`Hi ${ME.name.split(' ')[0]}. I can explain any topic from your 30 days, work through calculations and tell you what comes next. Please never paste client names, PAN or account numbers.`);if(!d.hidden)$('#chatInput').focus()};
$('#closeChat').onclick=()=>$('#drawer').hidden=true;
$('#chatForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#chatInput').value.trim();if(!v)return;$('#chatInput').value='';ask(v)});

const h=(location.hash||'').slice(1); if(views[h])view=h;
render();
</script>
